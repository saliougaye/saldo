<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0.4 MCP — Connettori, consenso, admin — varianti</title>
<!--
  Step 0.4-ui (spec §17.4.3). Tre schermi, tre varianti ciascuno, con i loro stati.
  Decisioni (utente, 2026-10-03) — variante «S · Scelta», registrata in spec §17.4.3:
    apps     «Connettori» (non «App collegate»), /profile/connectors: la parte alta di C (sezione «Collega» con tab per client) + le righe e il pannello a lato di B
    consent  C · Carta del client
    admin    C · voce propria «MCP» nella sub-nav dell'admin, /admin/mcp
    copy     si dice «MCP» / «client MCP», mai «assistente/assistenti», in tutte le schermate

  Schermi:
    apps     /profile/connectors    A · Card + righe   B · Righe = passkey (pannello)   C · Due sezioni
    consent  /oauth/consent         A · Scope con spunte   B · Compatto   C · Carta del client
    admin    /admin/settings        A · Riga + pannello   B · Interruttore nella riga   C · Sezione «MCP» (/admin/mcp)

  URL: ?screen=apps|consent|admin&variant=S|A|B|C&state=<id>&theme=dark|light
-->
<style>
@font-face{font-family:Geist;font-weight:400;src:url("../../../node_modules/.pnpm/@expo-google-fonts+geist@0.4.2/node_modules/@expo-google-fonts/geist/400Regular/Geist_400Regular.ttf")}
@font-face{font-family:Geist;font-weight:500;src:url("../../../node_modules/.pnpm/@expo-google-fonts+geist@0.4.2/node_modules/@expo-google-fonts/geist/500Medium/Geist_500Medium.ttf")}
@font-face{font-family:Geist;font-weight:600;src:url("../../../node_modules/.pnpm/@expo-google-fonts+geist@0.4.2/node_modules/@expo-google-fonts/geist/600SemiBold/Geist_600SemiBold.ttf")}

/* ---------- tokens — the names tokensCss() emits (packages/ui/src/tokens.ts) ---------- */
:root{
  --font-family:Geist,"Inter Tight",ui-sans-serif,system-ui,sans-serif;
  --font-size-caption:11px;--font-size-footnote:13px;--font-size-body:15px;--font-size-headline:17px;--font-size-title:24px;--font-size-display:34px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-semibold:600;
  --tracking-tighter:-0.02em;--tracking-tight:-0.01em;
  --radius-icon-box:8px;--radius-input:10px;--radius-button:12px;--radius-card:14px;--radius-dialog:16px;--radius-pill:999px;
  --layout-topbar-height:64px;--layout-content-wide:1120px;--layout-page-padding-web:48px;--layout-nav-item-height:36px;
  --layout-header-button:34px;--layout-subnav-width:220px;--layout-auth-width:380px;--layout-panel-width:420px;--layout-min-hit-target:44px;
  --motion-press:120ms;--motion-easing:cubic-bezier(0.2,0,0,1);
  --chrome:#17171a;--chrome-text:#d6d6d6;--chrome-dim:#8a8a8a;
}
[data-theme="dark"]{color-scheme:dark;
  --color-page:#050505;--color-bg:#0A0A0A;--color-surface:#121212;--color-raised:#1A1A1A;
  --color-border:rgba(255,255,255,0.07);--color-border-strong:rgba(255,255,255,0.12);
  --color-text:#EDEDED;--color-text-muted:#8C8C8C;--color-text-faint:#5C5C5C;
  --color-accent:#C7C7C7;--color-positive:#5FBF7F;--color-negative:#E5484D;--color-warning:#E0A531;--color-on-accent:#0A0A0A;--color-shadow:rgba(0,0,0,0.5);}
[data-theme="light"]{color-scheme:light;
  --color-page:#E9E9E7;--color-bg:#FFFFFF;--color-surface:#FAFAF9;--color-raised:#F1F1EF;
  --color-border:rgba(0,0,0,0.08);--color-border-strong:rgba(0,0,0,0.18);
  --color-text:#171717;--color-text-muted:#6E6E6E;--color-text-faint:#9A9A9A;
  --color-accent:#2B2B2B;--color-positive:#2E8A50;--color-negative:#C8333A;--color-warning:#A8711A;--color-on-accent:#FFFFFF;--color-shadow:rgba(0,0,0,0.18);}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0e0e10;color:var(--chrome-text);font-family:var(--font-family);font-size:13px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}

/* ---------- harness chrome ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 16px;background:var(--chrome);border-bottom:1px solid #2a2a2e;position:sticky;top:0;z-index:5}
.toolbar .grp{display:flex;align-items:center;gap:6px}
.toolbar .label{color:var(--chrome-dim);margin-right:2px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;background:#232327;border-radius:8px;padding:2px}
.seg button{padding:5px 10px;border-radius:6px;color:var(--chrome-dim);font-size:12.5px}
.seg button[aria-pressed="true"]{background:#3a3a40;color:#fff}
.toolbar .caption{flex:1 1 100%;color:var(--chrome-dim);font-size:12.5px;line-height:1.45;max-width:1100px}
.toolbar .caption b{color:#e6e6e6;font-weight:500}
.stage{flex:1;display:flex;gap:24px;padding:24px;align-items:flex-start;justify-content:center;overflow:auto}
.frame{border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);border:1px solid #2a2a2e;background:var(--color-bg);display:flex;flex-direction:column}
.frame.desk{width:1240px;height:820px;flex:none}
.frame.narrow{width:390px;height:820px;flex:none}
.urlbar{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#1b1b1f;color:#9a9a9a;font-size:12px;border-bottom:1px solid #2a2a2e}
.urlbar .dots{display:flex;gap:5px}.urlbar .dots i{width:10px;height:10px;border-radius:50%;background:#3a3a40}
.urlbar .u{flex:1;text-align:center;font-family:ui-monospace,Menlo,monospace}

/* ---------- app (reads only token variables) ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-rows:var(--layout-topbar-height) 1fr;background:var(--color-bg);color:var(--color-text);font-size:var(--font-size-body)}
.app.auth{grid-template-rows:1fr}
.app :focus-visible{outline:2px solid var(--color-text);outline-offset:2px;border-radius:var(--radius-input)}
.press{transition-property:scale,background-color,color;transition-duration:var(--motion-press);transition-timing-function:var(--motion-easing)}
.press:active{scale:.96}
.ico{display:inline-grid;place-items:center;width:1em;height:1em;font-size:16px;flex:none}
.ico svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.topbar{display:flex;align-items:center;gap:32px;padding:0 var(--layout-page-padding-web);border-bottom:1px solid var(--color-border)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:28px;height:28px;border-radius:var(--radius-icon-box);background:var(--color-text);color:var(--color-bg);display:grid;place-items:center;font-weight:var(--font-weight-semibold);font-size:var(--font-size-footnote)}
.brand .name{font-size:var(--font-size-headline);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tighter)}
.brand .inst{font-size:var(--font-size-footnote);color:var(--color-text-faint)}
.nav{display:flex;gap:4px}
.nav-item{display:flex;align-items:center;gap:8px;height:var(--layout-nav-item-height);padding:0 12px;border-radius:var(--radius-input);color:var(--color-text-muted);letter-spacing:var(--tracking-tight)}
.nav-item[aria-current="page"]{background:var(--color-raised);color:var(--color-text)}
.topbar .spacer{flex:1}
.topbar .end{display:flex;align-items:center;gap:12px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;border-radius:var(--radius-button);padding:0 14px;background:var(--color-accent);color:var(--color-on-accent);font-weight:var(--font-weight-medium);font-size:var(--font-size-footnote);white-space:nowrap}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius-button);background:var(--color-raised);color:var(--color-text);font-size:var(--font-size-footnote);font-weight:var(--font-weight-medium);white-space:nowrap}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--radius-input);color:var(--color-text-muted);font-size:var(--font-size-footnote)}
.btn-ghost:hover{color:var(--color-text);background:var(--color-raised)}
.btn-danger{color:var(--color-negative)}
.lg{height:44px;font-size:var(--font-size-body);width:100%}
.btn-primary[disabled],.btn-secondary[disabled]{opacity:.45;pointer-events:none}
.kbd{font-size:var(--font-size-caption);border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.55;line-height:1.5}
.avatar{width:var(--layout-header-button);height:var(--layout-header-button);border-radius:var(--radius-pill);background:var(--color-raised);border:1px solid var(--color-border);display:grid;place-items:center;font-size:var(--font-size-caption);color:var(--color-text-muted);font-weight:var(--font-weight-medium)}

.main{overflow-y:auto;min-height:0;scrollbar-width:thin;position:relative}
.page{max-width:calc(var(--layout-content-wide) + 2*var(--layout-page-padding-web));margin:0 auto;padding:48px var(--layout-page-padding-web) 64px}
.prof-head{display:flex;align-items:center;gap:20px;margin-bottom:56px}
.big-avatar{width:64px;height:64px;border-radius:var(--radius-pill);background:var(--color-raised);display:grid;place-items:center;font-size:var(--font-size-headline);color:var(--color-text-muted);font-weight:var(--font-weight-medium)}
.who .n{font-size:var(--font-size-title);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tighter)}
.who .e{font-size:var(--font-size-footnote);color:var(--color-text-muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.badge{padding:2px 8px;border-radius:var(--radius-pill);background:var(--color-raised);font-size:var(--font-size-caption)}

.settings{display:grid;grid-template-columns:var(--layout-subnav-width) minmax(0,1fr);gap:64px;align-items:start}
.settings.with-panel{grid-template-columns:var(--layout-subnav-width) minmax(0,1fr) var(--layout-panel-width);gap:48px}
.subnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.subnav button{height:var(--layout-nav-item-height);padding:0 12px;border-radius:var(--radius-input);color:var(--color-text-muted);text-align:left;display:flex;align-items:center;gap:10px}
.subnav button[aria-current="page"]{background:var(--color-raised);color:var(--color-text)}
.subnav .sep{height:1px;background:var(--color-border);margin:10px 12px}
.subnav .leave{color:var(--color-accent)}

.section>h2{font-size:var(--font-size-headline);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tighter);padding-bottom:16px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:10px}
.section>h2 .count{font-weight:var(--font-weight-regular);color:var(--color-text-faint);font-size:var(--font-size-footnote)}
.stack{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.body{color:var(--color-text-muted);line-height:1.5;text-wrap:pretty}
.hint{font-size:var(--font-size-footnote);color:var(--color-text-faint);line-height:1.45;text-wrap:pretty}
.section+.section{margin-top:48px}

/* rows (SummaryRow / passkeys' row) */
.rows{display:flex;flex-direction:column;width:100%}
.row{display:flex;align-items:center;gap:14px;min-height:var(--layout-min-hit-target);padding:14px 12px;margin:0 -12px;border-radius:var(--radius-input);text-align:left;width:calc(100% + 24px)}
.row:hover{background:color-mix(in srgb,var(--color-raised) 60%,transparent)}
.row[aria-selected="true"],.row[aria-selected="true"]:hover{background:var(--color-raised)}
.row+.row{border-top:1px solid var(--color-border)}
.tile{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:var(--radius-input);background:var(--color-raised);color:var(--color-text-muted)}
.row[aria-selected="true"] .tile{background:var(--color-surface)}
.tile.lg{width:44px;height:44px;border-radius:var(--radius-button)}
.row .text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .title{font-weight:var(--font-weight-medium);display:flex;align-items:center;gap:8px}
.row .sub{font-size:var(--font-size-footnote);color:var(--color-text-faint);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.row .value{color:var(--color-text-muted);font-size:var(--font-size-footnote);white-space:nowrap}
.row .trail{display:flex;align-items:center;gap:8px;flex:none}
.row .last-n{display:none}
.narrow .row .last-n{display:inline}
.narrow .row .trail .value{display:none}
.narrow .row:has(.inline-confirm){flex-wrap:wrap}
.narrow .row .trail:has(.inline-confirm){flex-basis:100%}
.narrow .row .inline-confirm{flex-wrap:wrap;justify-content:flex-end;white-space:normal;width:100%}
.narrow .row .inline-confirm span{flex-basis:100%}
.chev{color:var(--color-text-faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--color-positive);flex:none}
.dot.off{background:var(--color-text-faint)}

.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--radius-pill);border:1px solid var(--color-border-strong);color:var(--color-text-muted);font-size:var(--font-size-caption);white-space:nowrap}
.chip .ico{font-size:12px}
.chip.on{background:var(--color-text);color:var(--color-bg);border-color:transparent}
.pill{font-size:var(--font-size-caption);color:var(--color-text-muted);padding:2px 8px;border-radius:var(--radius-pill);background:var(--color-raised);white-space:nowrap}

/* card + code */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:var(--font-size-body);font-weight:var(--font-weight-medium);display:flex;align-items:center;gap:10px}
.code{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 12px;border-radius:var(--radius-input);background:var(--color-raised);font-family:ui-monospace,Menlo,monospace;font-size:13px;min-width:0}
.code .v{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code.block{height:auto;padding:10px 12px;align-items:flex-start;white-space:pre-wrap;line-height:1.5;word-break:break-all}
.copy{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;color:var(--color-text-muted);font-size:var(--font-size-caption);font-family:var(--font-family)}
.copy:hover{background:var(--color-surface);color:var(--color-text)}
.steps{display:flex;flex-direction:column;gap:10px;font-size:var(--font-size-footnote);color:var(--color-text-muted);line-height:1.5}
.steps li{display:flex;gap:10px}
.steps li b{font-weight:var(--font-weight-medium);color:var(--color-text-faint);min-width:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--color-border)}
.tabs button{height:36px;padding:0 10px;color:var(--color-text-muted);font-size:var(--font-size-footnote);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--color-text);border-color:var(--color-text)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 16px;color:var(--color-text-muted);border:1px dashed var(--color-border-strong);border-radius:var(--radius-card)}
.empty .ico{font-size:24px;color:var(--color-text-faint)}
.empty b{color:var(--color-text);font-weight:var(--font-weight-medium)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-card);background:var(--color-raised);font-size:var(--font-size-footnote);line-height:1.45}
.alert .ico{margin-top:1px;color:var(--color-text-muted)}
.alert b{display:block;font-weight:var(--font-weight-medium);margin-bottom:2px}
.alert span{color:var(--color-text-muted)}
.alert.warn .ico{color:var(--color-warning)}
.alert.err .ico{color:var(--color-negative)}
.alert a{color:var(--color-text);text-decoration:underline;text-underline-offset:3px}
.inline-confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.inline-confirm span{font-size:var(--font-size-footnote);color:var(--color-text-muted)}
.disclosure{display:flex;align-items:center;gap:8px;color:var(--color-text-muted);font-size:var(--font-size-footnote)}
.disclosure .ico{transition:rotate var(--motion-press) var(--motion-easing)}
.disclosure[aria-expanded="true"] .ico{rotate:90deg}

/* trailing panel */
.panel{border-left:1px solid var(--color-border);padding:0 0 0 48px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0}
.panel .ph{display:flex;align-items:center;gap:12px}
.panel .ph h3{font-size:var(--font-size-headline);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tighter);flex:1}
.facts{display:flex;flex-direction:column;border-radius:var(--radius-card);background:var(--color-surface);border:1px solid var(--color-border)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:var(--font-size-footnote)}
.facts div+div{border-top:1px solid var(--color-border)}
.facts dt{color:var(--color-text-muted)}
.facts dd{text-align:right;display:flex;align-items:center;gap:6px;min-width:0}
.facts code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.panel .foot{display:flex;flex-direction:column;gap:10px;margin-top:auto}

/* switch (ui/Switch) */
.toggle-row{display:flex;align-items:flex-start;gap:12px}
.toggle-row .txt{flex:1}
.toggle-row .txt span{display:block}
.toggle-row .txt .note{font-size:var(--font-size-footnote);color:var(--color-text-faint);margin-top:2px;text-wrap:pretty}
.switch{width:44px;height:26px;border-radius:var(--radius-pill);background:var(--color-border-strong);position:relative;flex:none;transition:background var(--motion-press) var(--motion-easing)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--color-bg);transition:translate 160ms var(--motion-easing)}
.switch[aria-checked="true"]{background:var(--color-positive)}
.switch[aria-checked="true"]::after{translate:18px 0}
.switch[disabled]{opacity:.5;cursor:not-allowed}

/* settings rows (admin) */
.srow{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:14px 12px;margin:0 -12px;border-radius:var(--radius-input);text-align:left;width:calc(100% + 24px)}
.srow+.srow{border-top:1px solid var(--color-border)}
.srow:hover{background:color-mix(in srgb,var(--color-raised) 60%,transparent)}
.srow[aria-selected="true"]{background:var(--color-raised)}
.srow .text{display:flex;flex-direction:column;gap:2px;min-width:0}
.srow .title{font-weight:var(--font-weight-medium)}
.srow .sub{font-size:var(--font-size-footnote);color:var(--color-text-faint)}
.srow .value{font-size:var(--font-size-footnote);color:var(--color-text-muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.locknote{display:flex;align-items:center;gap:8px;font-size:var(--font-size-footnote);color:var(--color-text-muted)}
code.env{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--color-raised);padding:2px 6px;border-radius:6px;color:var(--color-text)}
.form-foot{display:flex;align-items:center;gap:10px;padding-top:4px}
.form-foot .spacer{flex:1}
.form-foot .k{font-size:var(--font-size-caption);color:var(--color-text-faint)}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.kv div{padding:14px 16px;border-radius:var(--radius-card);background:var(--color-surface);border:1px solid var(--color-border)}
.kv dt{font-size:var(--font-size-footnote);color:var(--color-text-muted)}
.kv dd{font-size:var(--font-size-title);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tighter);margin-top:4px}
.kv dd small{font-size:var(--font-size-footnote);font-weight:var(--font-weight-regular);color:var(--color-text-faint);margin-left:6px}

/* auth column (consent) */
.auth-page{min-height:100%;display:grid;place-items:center;padding:48px 24px}
.auth-col{width:100%;max-width:var(--layout-auth-width);display:flex;flex-direction:column;gap:24px}
.auth-col .title{font-size:var(--font-size-title);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tighter);text-wrap:balance}
.lede{color:var(--color-text-muted);line-height:1.5;text-wrap:pretty;margin-top:-12px}
.lede b{color:var(--color-text);font-weight:var(--font-weight-medium)}
.scopes{border-radius:var(--radius-card);background:var(--color-surface);border:1px solid var(--color-border);overflow:hidden}
.scope{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;text-align:left;width:100%}
.scope+.scope{border-top:1px solid var(--color-border)}
.scope .tile{background:var(--color-raised)}
.scope .txt{flex:1;display:flex;flex-direction:column;gap:2px}
.scope .txt b{font-weight:var(--font-weight-medium)}
.scope .txt span{font-size:var(--font-size-footnote);color:var(--color-text-faint);line-height:1.4}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--color-border-strong);display:grid;place-items:center;flex:none;color:var(--color-bg)}
.check .ico{font-size:13px;opacity:0}
.scope[aria-checked="true"] .check{background:var(--color-text);border-color:var(--color-text)}
.scope[aria-checked="true"] .check .ico{opacity:1}
.scope.locked{opacity:.75;pointer-events:none}
.scope.locked .check{background:var(--color-text-faint);border-color:transparent}
.scope .ro{font-size:var(--font-size-caption);color:var(--color-text-faint);white-space:nowrap}
.client{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-card);background:var(--color-surface);border:1px solid var(--color-border)}
.client .tile{width:44px;height:44px;border-radius:var(--radius-button);font-size:var(--font-size-headline);font-weight:var(--font-weight-semibold);color:var(--color-text)}
.client .txt{flex:1;min-width:0}
.client .txt b{display:block;font-weight:var(--font-weight-medium)}
.client .txt span{display:block;font-size:var(--font-size-footnote);color:var(--color-text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{display:flex;align-items:center;gap:10px;font-size:var(--font-size-footnote);color:var(--color-text-muted);justify-content:center}
.me .avatar{width:24px;height:24px;font-size:10px}
.me a{color:var(--color-text);text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-direction:column;gap:10px}
.textlink{align-self:center;color:var(--color-text-muted);font-size:var(--font-size-footnote);text-decoration:underline;text-decoration-color:var(--color-border-strong);text-underline-offset:3px}
.bul{display:flex;flex-direction:column;gap:12px}
.bul li{display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.bul .ico{margin-top:3px;color:var(--color-text-muted)}
.bul span{color:var(--color-text-muted);font-size:var(--font-size-footnote);display:block}
.bul b{font-weight:var(--font-weight-medium)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.art{width:72px;height:72px;border-radius:var(--radius-dialog);background:var(--color-raised);display:grid;place-items:center;color:var(--color-text)}
.art .ico{font-size:30px}
.art.bad{color:var(--color-negative)}

/* narrow frame */
.narrow .row[aria-selected="true"]{background:none}
.narrow .page.solo > .section:first-of-type > h2{display:none}
.narrow .panel.pushed{border:0;padding:0;position:static}
.narrow .panel.pushed .ph{display:none}
.narrow .page{padding:16px 20px 32px}
.narrow .prof-head{margin-bottom:24px}
.narrow .settings{display:block}
.narrow .subnav{display:none}
.narrow .push-head{display:flex;align-items:center;gap:8px;height:54px;margin:0 -8px 8px}
.narrow .push-head .t{font-size:var(--font-size-headline);font-weight:var(--font-weight-semibold)}
.narrow .auth-page{place-items:start center;padding:56px 20px 32px}
.narrow .kv{grid-template-columns:1fr}
</style>
</head>
<body>
<div class="toolbar">
  <div class="grp"><span class="label">Schermo</span><div class="seg" data-k="screen"><button data-v="apps">Connettori</button><button data-v="consent">Consenso</button><button data-v="admin">Admin</button></div></div>
  <div class="grp"><span class="label">Variante</span><div class="seg" data-k="variant"><button data-v="S">★ Scelta</button><button data-v="A">A</button><button data-v="B">B</button><button data-v="C">C</button></div></div>
  <div class="grp"><span class="label">Stato</span><div class="seg" data-k="state" id="states"></div></div>
  <div class="grp"><span class="label">Tema</span><div class="seg" data-k="theme"><button data-v="dark">Scuro</button><button data-v="light">Chiaro</button></div></div>
  <div class="caption" id="caption"></div>
</div>
<div class="stage">
  <div class="frame desk" id="deskFrame"><div class="urlbar"><div class="dots"><i></i><i></i><i></i></div><span class="u" id="url"></span></div><div class="app" id="desk" data-theme="dark"></div></div>
  <div class="frame narrow" id="narrowFrame"><div class="urlbar"><span class="u" id="url2"></span></div><div class="app narrow" id="narrow" data-theme="dark"></div></div>
</div>

<script>
/* ---------- icons (Lucide-style outlines, same set as apps/web/src/ui/Icon) ---------- */
const ICONS = {
  plug:'<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a6 6 0 0 1-12 0V8Z"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.7 9a.6.6 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.3 0C14.2 3.8 16.7 5 18.7 5a1 1 0 0 1 1 1Z"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  alert:'<path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  pen:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/>',
  bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  terminal:'<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  house:'<path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20Z"/><path d="M9 21.5v-7h6v7"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1Z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
  ticket:'<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>',
  server:'<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01"/><path d="M6 18h.01"/>',
  arrowUR:'<path d="M7 17 17 7"/><path d="M7 7h10v10"/>',
  tag:'<path d="M12.6 2.6 21.4 11.4a2 2 0 0 1 0 2.8l-7.2 7.2a2 2 0 0 1-2.8 0L2.6 12.6A2 2 0 0 1 2 11.2V4a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.4.6Z"/><circle cx="7.5" cy="7.5" r="1"/>',
  grip:'<circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  piggy:'<path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/>',
  archive:'<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
};
const icon = (n) => `<span class="ico"><svg viewBox="0 0 24 24">${ICONS[n] || ''}</svg></span>`;

/* ---------- harness state ---------- */
const SCREENS = {
  apps: { title: 'Profilo › Connettori', states: [['filled','2 connettori'],['empty','Vuoto'],['revoke','Revoca'],['off','MCP spento'],['offAdmin','Spento (sei admin)']] },
  consent: { title: '/oauth/consent', states: [['both','Lettura + scrittura'],['read','Solo lettura'],['readonlyClient','Chiede solo lettura'],['denied','Negato'],['off','MCP spento']] },
  admin: { title: 'Admin › Impostazioni', states: [['on','Attivo'],['off','Spento'],['locked','Da env'],['confirm','Conferma spegnimento']] },
};
const VARIANT_NAMES = {
  apps: { S: 'Scelta: Collega di C + righe e pannello di B', A: 'Card + righe', B: 'Righe come passkey, pannello a lato', C: 'Due sezioni' },
  consent: { S: 'Scelta: C · Carta del client', A: 'Scope con spunte', B: 'Compatto', C: 'Carta del client' },
  admin: { S: 'Scelta: C · Sezione «MCP»', A: 'Riga + pannello', B: 'Interruttore nella riga', C: 'Sezione «MCP»' },
};
const CAPTIONS = {
  apps: {
    S: '<b>★ Scelta.</b> In alto la sezione «Collega» di C: endpoint da copiare, tab per client (Claude Code · Claude · Altro) con lo snippet esatto. Sotto, «Autorizzati» con le righe di B: cliccando una si apre il pannello a lato con i fatti e «Revoca» in fondo; su mobile il pannello è una schermata spinta.',
    A: '<b>A · Card + righe.</b> In testa la card «Collega un client MCP» con l’endpoint da copiare e due istruzioni; sotto, una riga per app con scope come chip, data e ultimo uso, «Revoca» a destra con conferma in linea. Tutto su una colonna, niente pannello.',
    B: '<b>B · Righe come passkey.</b> La pagina ripete Passkey: un paragrafo, le righe (nome, scope, ultimo uso), cliccando una si apre il pannello a lato con i fatti (host del redirect, autorizzata il, chiamate) e «Revoca» in fondo. Le istruzioni di collegamento stanno in una disclosure «Come collegare» sotto le righe.',
    C: '<b>C · Due sezioni.</b> «Collega» con tab per client (Claude Code · Claude · Altro) e lo snippet esatto da incollare; «Autorizzati» con le righe e «Revoca» in linea. Più verbosa, più didattica.',
  },
  consent: {
    S: '<b>★ Scelta = C · Carta del client.</b> Prima la carta dell’app (iniziale, nome, host, «registrata adesso» con avviso se mai vista prima), poi gli scope con spunte, poi i bottoni.',
    A: '<b>A · Scope con spunte.</b> Titolo «{client} vuole accedere a Saldo», host del redirect nel sottotitolo, due righe di scope con spunta: Lettura obbligatoria (è il minimo richiesto), Scrittura deselezionabile. Sotto, chi sei e «non sei tu?». Autorizza / Nega.',
    B: '<b>B · Compatto.</b> Niente spunte: gli scope sono un elenco con icona e una riga di spiegazione. Il CTA autorizza tutto; «Autorizza solo la lettura» è un link secondario quando il client chiede anche la scrittura. Meno controlli, meno attrito.',
    C: '<b>C · Carta del client.</b> Prima la carta dell’app (iniziale, nome, host, «registrata adesso» con avviso se mai vista prima), poi gli scope con spunte, poi i bottoni. Mette il «chi» prima del «cosa».',
  },
  admin: {
    S: '<b>★ Scelta = C · Sezione «MCP».</b> Voce propria nella sub-nav dell’admin (/admin/mcp): l’interruttore, tre numeri (utenti con connettori, connettori autorizzati, usati negli ultimi 7 giorni) e l’endpoint con gli URL di discovery.',
    A: '<b>A · Riga + pannello.</b> Come le altre impostazioni: la riga «MCP · Attivo» apre il pannello a lato con l’interruttore, la spiegazione e «Salva». Da env: la riga mostra il lucchetto e il pannello dice quale variabile.',
    B: '<b>B · Interruttore nella riga.</b> L’interruttore sta nella riga, si salva al tocco; spegnere chiede conferma (ferma N utenti). Niente pannello. Da env: interruttore disabilitato con nota.',
    C: '<b>C · Sezione «MCP».</b> Una voce propria nella sub-nav dell’admin: l’interruttore, tre numeri (utenti con connettori, connettori autorizzati, usati negli ultimi 7 giorni) e gli URL di discovery da verificare. Più spazio, una voce in più.',
  },
};

const q = new URLSearchParams(location.search);
const S = {
  screen: SCREENS[q.get('screen')] ? q.get('screen') : 'apps',
  variant: ['S','A','B','C'].includes(q.get('variant')) ? q.get('variant') : 'S',
  state: q.get('state'),
  theme: q.get('theme') === 'light' ? 'light' : 'dark',
  tab: 'claude-code', writeOn: true, open: 0, disclosure: false,
};
if (!SCREENS[S.screen].states.some(([id]) => id === S.state)) S.state = SCREENS[S.screen].states[0][0];

const HOST = 'saldo.casa-gaye.it';
const ENDPOINT = `https://${HOST}/mcp`;
const APPS = [
  { name: 'Claude Code', scopes: ['read','write'], host: 'localhost', authorized: '3 ott 2026', last: '2 min fa', calls: 148, since: 'oggi' },
  { name: 'Claude', scopes: ['read'], host: 'claude.ai', authorized: '28 set 2026', last: 'ieri, 21:14', calls: 37, since: '5 giorni fa' },
];

/* ---------- shell ---------- */
const NAV = [['Home','house'],['Transazioni','grip'],['Statistiche','target'],['Conti','piggy']];
function topbar(admin) {
  return `<header class="topbar"><div class="brand"><span class="mark">S</span><span class="name">Saldo</span><span class="inst">· Casa Gaye</span></div>
    <nav class="nav">${NAV.map(([l,n]) => `<button class="nav-item press">${icon(n)}<span>${l}</span></button>`).join('')}</nav>
    <div class="spacer"></div><div class="end"><button class="nav-item press" ${admin ? 'aria-current="page"' : ''} aria-label="Admin">${icon('shield')}</button>
    <button class="btn-primary press">${icon('plus')}<span>Nuova transazione</span><span class="kbd">N</span></button><button class="avatar press" style="${admin ? '' : 'box-shadow:0 0 0 2px var(--color-text)'}">SG</button></div></header>`;
}
function profileHead() {
  return `<div class="prof-head"><span class="big-avatar">SG</span><div class="who"><div class="n">Saliou Gaye</div><div class="e">gayesaliou29@gmail.com <span class="badge">admin</span></div></div></div>`;
}
function subnav(cur, items, leave) {
  return `<nav class="subnav">${items.map(([n,i]) => `<button class="press" ${n === cur ? 'aria-current="page"' : ''}>${icon(i)}${n}</button>`).join('')}
    <div class="sep"></div><button class="press leave">${icon('arrowUR')}${leave}</button></nav>`;
}
const PROFILE_ITEMS = [['Account','settings'],['Preferenze','wrench'],['Categorie','grip'],['Tag','tag'],['Budget','target'],['Obiettivi','piggy'],['Passkey','key'],['Dati','archive'],['Connettori','plug']];
const ADMIN_ITEMS = [['Account','users'],['Inviti','ticket'],['Istanza','server'],['Impostazioni','settings']];

/* ---------- shared pieces ---------- */
const scopeChips = (scopes) => (scopes.includes('read') ? `<span class="chip">${icon('eye')}Lettura</span>` : '') + (scopes.includes('write') ? `<span class="chip">${icon('pen')}Scrittura</span>` : '');
const endpointCode = () => `<div class="code"><span class="v">${ENDPOINT}</span><button class="copy press">${icon('copy')}Copia</button></div>`;
const snippet = (tab) => tab === 'claude-code'
  ? `<div class="code block">claude mcp add --transport http saldo ${ENDPOINT}</div><p class="hint">Alla prima chiamata Claude Code apre il browser su questa istanza per autorizzare.</p>`
  : tab === 'claude'
  ? `<ol class="steps"><li><b>1</b><span>In Claude (web o app) apri Impostazioni › Connettori › Aggiungi connettore personalizzato.</span></li><li><b>2</b><span>Incolla l’indirizzo qui sopra come URL del server. Nessuna chiave: ti verrà chiesto di accedere a Saldo con la passkey.</span></li></ol>`
  : `<p class="hint">Qualunque client MCP con trasporto HTTP e OAuth: incolla l’indirizzo, il resto lo scopre da solo (<code class="env">/.well-known/oauth-protected-resource</code>). Da terminale senza browser: <code class="env">npx mcp-remote ${ENDPOINT}</code>.</p>`;
const offAlert = (admin) => `<div class="alert warn">${icon('alert')}<div><b>MCP è disattivato su questa istanza</b><span>${admin ? 'L’hai spento tu in <a href="#">Amministrazione › MCP</a>. I connettori già autorizzati restano in lista e riprendono quando lo riattivi.' : 'L’amministratore ha spento l’accesso MCP. I connettori già autorizzati restano in lista e riprendono quando viene riattivato.'}</span></div></div>`;
const revokeInline = () => `<div class="inline-confirm"><span>Claude Code smetterà di funzionare alla prossima chiamata.</span><button class="btn-secondary press">Annulla</button><button class="btn-secondary btn-danger press">Revoca</button></div>`;

function appRow(a, i, { trailing = 'revoke', selectable = false, revoking = false } = {}) {
  const trail = revoking ? revokeInline()
    : trailing === 'revoke' ? `<span class="value">Ultimo uso ${a.last}</span><button class="btn-ghost press btn-danger">Revoca</button>`
    : `<span class="value">${a.last}</span>${icon('chevR').replace('class="ico"', 'class="ico chev"')}`;
  return `<${selectable ? 'button' : 'div'} class="row press" ${selectable && S.open === i ? 'aria-selected="true"' : ''} data-i="${i}">
    <span class="tile">${icon(a.name.startsWith('Claude Code') ? 'terminal' : 'bot')}</span>
    <span class="text"><span class="title">${a.name}</span><span class="sub">${scopeChips(a.scopes)}<span>· autorizzata il ${a.authorized}</span><span class="last-n">· usata ${a.last}</span></span></span>
    <span class="trail">${trail}</span></${selectable ? 'button' : 'div'}>`;
}
const emptyApps = () => `<div class="empty">${icon('plug')}<b>Nessun connettore collegato</b><span>Quando autorizzi un client MCP dal browser, compare qui con quello che può fare.</span></div>`;

/* ---------- screen: /profile/connectors ---------- */
function appsSection() {
  const { variant, state } = S;
  const off = state === 'off' || state === 'offAdmin';
  const apps = state === 'empty' ? [] : APPS;
  const panelled = variant === 'B' || variant === 'S';
  const rows = apps.length ? `<div class="rows">${apps.map((a, i) => appRow(a, i, { trailing: panelled ? 'chev' : 'revoke', selectable: panelled, revoking: state === 'revoke' && i === 0 && !panelled })).join('')}</div>` : emptyApps();
  const connectCard = `<div class="card"><h3>${icon('plug')}Collega un client MCP</h3><p class="hint">Dai questo indirizzo al tuo client MCP. Non c’è nessuna chiave da copiare: il client ti riporta qui, accedi con la passkey e scegli cosa può fare.</p>${endpointCode()}
    <ol class="steps"><li><b>1</b><span><b>Claude Code</b> · <code class="env">claude mcp add --transport http saldo ${ENDPOINT}</code></span></li><li><b>2</b><span><b>Claude, Cursor e gli altri</b> · incolla l’indirizzo dove il client chiede un server MCP remoto.</span></li></ol></div>`;

  if (variant === 'A') {
    return `<section class="section"><h2>Connettori ${apps.length ? `<span class="count">${apps.length}</span>` : ''}</h2><div class="stack">
      ${off ? offAlert(state === 'offAdmin') : ''}${off ? '' : connectCard}${rows}
      <p class="hint">Un connettore revocato riceve un errore alla chiamata successiva. Un’autorizzazione non usata per 180 giorni scade da sola.</p></div></section>`;
  }
  if (variant === 'B') {
    return `<section class="section"><h2>Connettori</h2><div class="stack">
      ${off ? offAlert(state === 'offAdmin') : ''}
      <p class="body">I client MCP che hai autorizzato a leggere o scrivere i tuoi dati. Qui vedi cosa possono fare e quando l’hanno fatto l’ultima volta; una revoca li ferma alla chiamata successiva.</p>
      ${rows}
      <button class="disclosure press" aria-expanded="${S.disclosure || !apps.length}">${icon('chevR')}Come collegare un client MCP</button>
      ${(S.disclosure || !apps.length) ? `<div class="stack" style="padding-top:0;gap:12px">${endpointCode()}<div class="tabs">${[['claude-code','Claude Code'],['claude','Claude'],['other','Altro client']].map(([id,l]) => `<button data-tab="${id}" aria-selected="${S.tab===id}">${l}</button>`).join('')}</div>${snippet(S.tab)}</div>` : ''}
      </div></section>`;
  }
  if (variant === 'S') {
    return `<section class="section"><h2>Collega</h2><div class="stack">
      ${off ? offAlert(state === 'offAdmin') : `<p class="hint">Dai questo indirizzo al tuo client MCP. Nessuna chiave da copiare: il client ti riporta qui, accedi con la passkey e scegli cosa può fare.</p>${endpointCode()}<div class="tabs">${[['claude-code','Claude Code'],['claude','Claude'],['other','Altro client']].map(([id,l]) => `<button data-tab="${id}" aria-selected="${S.tab===id}">${l}</button>`).join('')}</div>${snippet(S.tab)}`}
    </div></section>
    <section class="section"><h2>Autorizzati ${apps.length ? `<span class="count">${apps.length}</span>` : ''}</h2><div class="stack">${rows}
      <p class="hint">Un connettore revocato riceve un errore alla chiamata successiva. Un’autorizzazione non usata per 180 giorni scade da sola.</p></div></section>`;
  }
  return `<section class="section"><h2>Collega</h2><div class="stack">
      ${off ? offAlert(state === 'offAdmin') : `${endpointCode()}<div class="tabs">${[['claude-code','Claude Code'],['claude','Claude'],['other','Altro client']].map(([id,l]) => `<button data-tab="${id}" aria-selected="${S.tab===id}">${l}</button>`).join('')}</div>${snippet(S.tab)}`}
    </div></section>
    <section class="section"><h2>Autorizzati ${apps.length ? `<span class="count">${apps.length}</span>` : ''}</h2><div class="stack">${rows}
      <p class="hint">Un connettore revocato riceve un errore alla chiamata successiva. Un’autorizzazione non usata per 180 giorni scade da sola.</p></div></section>`;
}
function appsPanel() {
  const a = APPS[S.open] || APPS[0];
  const revoking = S.state === 'revoke';
  return `<aside class="panel"><div class="ph"><span class="tile lg">${icon(a.name.startsWith('Claude Code') ? 'terminal' : 'bot')}</span><h3>${a.name}</h3><button class="btn-ghost press" aria-label="Chiudi">${icon('x')}</button></div>
    <dl class="facts"><div><dt>Può</dt><dd>${scopeChips(a.scopes)}</dd></div><div><dt>Torna a</dt><dd><code>${a.host}</code></dd></div><div><dt>Autorizzata</dt><dd>${a.authorized}</dd></div><div><dt>Ultimo uso</dt><dd><span class="dot"></span>${a.last}</dd></div><div><dt>Chiamate</dt><dd>${a.calls} da ${a.since}</dd></div></dl>
    <p class="hint">Un client MCP vede quello che vedi tu in Saldo: conti, transazioni, budget, obiettivi. Con «Scrittura» può anche aggiungere o modificare, con le stesse regole dei moduli.</p>
    <div class="foot">${revoking ? `<div class="alert">${icon('info')}<div><b>Revocare ${a.name}?</b><span>Smetterà di funzionare alla prossima chiamata. Potrai autorizzarla di nuovo dal client.</span></div></div><div class="inline-confirm"><button class="btn-secondary press">Annulla</button><button class="btn-secondary btn-danger press">Revoca</button></div>` : `<button class="btn-secondary btn-danger press lg" style="height:40px">Revoca accesso</button>`}</div></aside>`;
}
function renderApps(el, narrow) {
  const withPanel = (S.variant === 'B' || S.variant === 'S') && !narrow && S.state !== 'empty';
  const pushed = S.variant === 'S' && narrow && S.state === 'revoke';
  const body = pushed
    ? `<div class="page"><div class="push-head"><button class="btn-ghost press">${icon('chevL')}</button><span class="t">${(APPS[S.open] || APPS[0]).name}</span></div>${appsPanel().replace('class="panel"', 'class="panel pushed"')}</div>`
    : narrow
    ? `<div class="page ${S.variant === 'C' || S.variant === 'S' ? '' : 'solo'}"><div class="push-head"><button class="btn-ghost press">${icon('chevL')}</button><span class="t">Connettori</span></div>${appsSection()}</div>`
    : `<div class="page">${profileHead()}<div class="settings ${withPanel ? 'with-panel' : ''}">${subnav('Connettori', PROFILE_ITEMS, 'Esci')}<div>${appsSection()}</div>${withPanel ? appsPanel() : ''}</div></div>`;
  el.className = `app ${narrow ? 'narrow' : ''}`;
  el.innerHTML = narrow ? `<main class="main" style="grid-row:1/-1">${body}</main>` : `${topbar(false)}<main class="main">${body}</main>`;
  return `${HOST}/profile/connectors`;
}

/* ---------- screen: /oauth/consent ---------- */
function consentColumn() {
  const { variant, state } = S;
  const client = state === 'readonlyClient' ? { name: 'Claude', host: 'claude.ai', fresh: false } : { name: 'Claude Code', host: 'localhost:52113', fresh: true };
  const wantsWrite = state !== 'readonlyClient';
  const writeOn = wantsWrite && S.writeOn && state !== 'read';
  const brand = `<div class="brand"><span class="mark">S</span><span class="name">Saldo</span><span class="inst">· Casa Gaye</span></div>`;
  const me = `<div class="me"><span class="avatar">SG</span><span>Accedi come <b style="color:var(--color-text);font-weight:500">gayesaliou29@gmail.com</b></span><a href="#">Non sei tu?</a></div>`;
  const hint = `<p class="hint" style="text-align:center">Potrai revocare l’accesso in qualsiasi momento da Profilo › Connettori. Il client non riceve mai la tua passkey.</p>`;

  if (state === 'off') {
    return `${brand}<div class="center"><span class="art bad">${icon('plug')}</span><h1 class="title">MCP è disattivato</h1><p class="lede" style="margin-top:0">L’amministratore di questa istanza ha spento l’accesso MCP. ${client.name} non può essere autorizzata finché non viene riattivato.</p></div><a class="btn-secondary press lg" href="#">Torna a Saldo</a>`;
  }
  if (state === 'denied') {
    return `${brand}<div class="center"><span class="art">${icon('x')}</span><h1 class="title">Accesso negato</h1><p class="lede" style="margin-top:0">Hai detto no a ${client.name}. Puoi chiudere questa scheda: il client è stato avvisato.</p></div><a class="btn-secondary press lg" href="#">Torna a Saldo</a>`;
  }

  const scopeRows = (locked) => `<div class="scopes" role="group" aria-label="Permessi">
    <button class="scope ${locked ? 'locked' : ''}" role="checkbox" aria-checked="true"><span class="tile">${icon('eye')}</span><span class="txt"><b>Leggere i tuoi dati</b><span>Conti e saldi, transazioni, budget, obiettivi, statistiche e previsioni: quello che vedi tu.</span></span>${locked ? `<span class="ro">richiesto</span>` : `<span class="check">${icon('check')}</span>`}</button>
    ${wantsWrite ? `<button class="scope" role="checkbox" aria-checked="${writeOn}" data-toggle="write"><span class="tile">${icon('pen')}</span><span class="txt"><b>Aggiungere e modificare</b><span>Transazioni, conti, categorie, tag, budget e obiettivi, con le stesse regole dei moduli. Non può toccare le ricorrenze né gli allegati.</span></span><span class="check">${icon('check')}</span></button>` : ''}
  </div>`;

  if (variant === 'A') {
    return `${brand}<h1 class="title">${client.name} vuole accedere a Saldo</h1><p class="lede">Un’app su <b>${client.host}</b> chiede il permesso di usare i tuoi dati su questa istanza. Scegli cosa può fare.</p>
      ${scopeRows(true)}${me}
      <div class="actions"><button class="btn-primary press lg">${wantsWrite && !writeOn ? 'Autorizza solo la lettura' : 'Autorizza'}</button><button class="btn-secondary press lg">Nega</button></div>${hint}`;
  }
  if (variant === 'B') {
    return `${brand}<h1 class="title">Autorizzi ${client.name}?</h1><p class="lede">Un’app su <b>${client.host}</b> potrà, a tuo nome:</p>
      <ul class="bul"><li>${icon('eye')}<div><b>Leggere i tuoi dati</b><span>Conti, transazioni, budget, obiettivi, statistiche e previsioni.</span></div></li>
      ${wantsWrite && state !== 'read' ? `<li>${icon('pen')}<div><b>Aggiungere e modificare</b><span>Transazioni, conti, categorie, tag, budget e obiettivi, con le regole dei moduli.</span></div></li>` : ''}</ul>
      ${me}
      <div class="actions"><button class="btn-primary press lg">Autorizza</button><button class="btn-secondary press lg">Nega</button>${wantsWrite && state !== 'read' ? `<a class="textlink" href="#">Autorizza solo la lettura</a>` : ''}</div>${hint}`;
  }
  return `${brand}<h1 class="title">Un’app chiede di collegarsi</h1>
    <div class="client"><span class="tile">${client.name[0]}</span><span class="txt"><b>${client.name}</b><span>torna a ${client.host} · ${client.fresh ? 'registrata adesso' : 'già autorizzata il 28 set'}</span></span></div>
    ${client.fresh ? `<div class="alert">${icon('info')}<div><b>Prima volta che vedi questa app</b><span>Il nome lo sceglie l’app stessa. Fidati solo se hai avviato tu la richiesta un momento fa.</span></div></div>` : ''}
    <p class="lede" style="margin-top:0">Cosa può fare a tuo nome:</p>${scopeRows(true)}${me}
    <div class="actions"><button class="btn-primary press lg">${wantsWrite && !writeOn ? 'Autorizza solo la lettura' : 'Autorizza'}</button><button class="btn-secondary press lg">Nega</button></div>${hint}`;
}
function renderConsent(el, narrow) {
  el.className = `app auth ${narrow ? 'narrow' : ''}`;
  el.innerHTML = `<main class="main"><div class="auth-page"><div class="auth-col">${consentColumn()}</div></div></main>`;
  return `${HOST}/oauth/consent?client_id=…`;
}

/* ---------- screen: admin ---------- */
function settingsRows(open) {
  const { variant, state } = S;
  const on = state !== 'off';
  const locked = state === 'locked';
  const mcpValue = variant === 'B'
    ? `<span class="value">${locked ? `${icon('lock')}MCP_ENABLED` : `${on ? '3 utenti collegati' : 'spento'}`}</span><button class="switch" role="switch" aria-checked="${on}" ${locked ? 'disabled' : ''} aria-label="MCP"></button>`
    : `<span class="value">${locked ? icon('lock') : ''}${on ? '<span class="dot"></span>Attivo' : '<span class="dot off"></span>Spento'}</span>${icon('chevR').replace('class="ico"','class="ico chev"')}`;
  const row = (ic, t, s, v, sel, tag = 'button') => `<${tag} class="srow ${tag === 'button' ? 'press' : ''}" ${sel ? 'aria-selected="true"' : ''}><span class="tile">${icon(ic)}</span><span class="text"><span class="title">${t}</span>${s ? `<span class="sub">${s}</span>` : ''}</span>${v}</${tag}>`;
  return `<div class="rows" style="margin-top:8px">
    ${row('house','Nome dell’istanza','Nel titolo, nelle email e nel passkey','<span class="value">Casa Gaye</span>'+icon('chevR').replace('class="ico"','class="ico chev"'))}
    ${row('shield','Registrazione','Chi può creare un account','<span class="value">Su invito</span>'+icon('chevR').replace('class="ico"','class="ico chev"'))}
    ${row('inbox','Email in uscita','SMTP, verifica e recupero','<span class="value"><span class="dot"></span>smtp.resend.com</span>'+icon('chevR').replace('class="ico"','class="ico chev"'))}
    ${row('plug','MCP','Claude e altri client MCP leggono e scrivono su autorizzazione dell’utente', mcpValue, open, variant === 'B' ? 'div' : 'button')}
  </div>`;
}
function mcpPanel() {
  const { state } = S;
  const on = state !== 'off';
  const locked = state === 'locked';
  return `<aside class="panel"><div class="ph"><span class="tile lg">${icon('plug')}</span><h3>MCP</h3><button class="btn-ghost press" aria-label="Chiudi">${icon('x')}</button></div>
    ${locked ? `<div class="alert">${icon('lock')}<div><b>Impostato dall’ambiente</b><span>Il server legge <code class="env">MCP_ENABLED=${on ? 'true' : 'false'}</code>. Per cambiarlo, cambia la variabile e riavvia.</span></div></div>` : ''}
    <div class="toggle-row"><div class="txt"><span>Permetti agli utenti di collegare client MCP</span><span class="note">Ogni utente autorizza i propri client dal browser, con la passkey, e sceglie se possono anche scrivere. Spento: l’endpoint <code class="env">/mcp</code> risponde 404 e le app già autorizzate si fermano finché non lo riaccendi.</span></div><button class="switch" role="switch" aria-checked="${on}" ${locked ? 'disabled' : ''}></button></div>
    <dl class="facts"><div><dt>Endpoint</dt><dd><code>${ENDPOINT}</code></dd></div><div><dt>Utenti con connettori</dt><dd>3</dd></div><div><dt>Usati negli ultimi 7 giorni</dt><dd>4</dd></div></dl>
    ${locked ? '' : `<div class="form-foot"><span class="k">⌘↵ salva</span><span class="spacer"></span><button class="btn-secondary press">Annulla</button><button class="btn-primary press" style="height:36px">Salva</button></div>`}</aside>`;
}
function adminSectionC() {
  const { state } = S;
  const on = state !== 'off';
  const locked = state === 'locked';
  return `<section class="section"><h2>MCP</h2><div class="stack">
    ${locked ? `<div class="locknote">${icon('lock')}Impostato dall’ambiente: <code class="env">MCP_ENABLED=${on ? 'true' : 'false'}</code></div>` : ''}
    <div class="toggle-row"><div class="txt"><span>Permetti agli utenti di collegare client MCP</span><span class="note">Ogni utente autorizza i propri client dal browser, con la passkey, e sceglie se possono anche scrivere. Spento: l’endpoint risponde 404 e le app già autorizzate si fermano finché non lo riaccendi.</span></div><button class="switch" role="switch" aria-checked="${on}" ${locked ? 'disabled' : ''}></button></div>
    ${state === 'confirm' ? `<div class="alert warn">${icon('alert')}<div><b>Spegnere MCP?</b><span>3 utenti hanno 5 connettori autorizzati: smetteranno di rispondere alla prossima chiamata. Le autorizzazioni restano e riprendono quando riaccendi.</span></div></div><div class="inline-confirm"><button class="btn-secondary press">Annulla</button><button class="btn-secondary btn-danger press">Spegni</button></div>` : ''}
    <dl class="kv"><div><dt>Utenti con connettori</dt><dd>3<small>su 4</small></dd></div><div><dt>Connettori autorizzati</dt><dd>5</dd></div><div><dt>Usati negli ultimi 7 giorni</dt><dd>4</dd></div></dl>
    <h3 style="font-size:var(--font-size-body);font-weight:500;margin-top:8px">Cosa dare a un client</h3>${endpointCode()}
    <p class="hint">I client scoprono il resto da soli: <code class="env">/.well-known/oauth-protected-resource</code> e <code class="env">/.well-known/oauth-authorization-server</code> rispondono su questo host. Serve <code class="env">PUBLIC_URL</code> in HTTPS: i client MCP rifiutano l’autorizzazione in chiaro.</p>
    </div></section>`;
}
function renderAdmin(el, narrow) {
  const { state } = S;
  const variant = S.variant === 'S' ? 'C' : S.variant;
  const openPanel = variant === 'A' && !narrow;
  let body;
  const confirm = variant === 'B' && state === 'confirm' ? `<div class="alert warn" style="margin-top:16px">${icon('alert')}<div><b>Spegnere MCP?</b><span>3 utenti hanno 5 connettori autorizzati: smetteranno di rispondere alla prossima chiamata. Le autorizzazioni restano e riprendono quando riaccendi.</span></div></div><div class="inline-confirm" style="margin-top:10px"><button class="btn-secondary press">Annulla</button><button class="btn-secondary btn-danger press">Spegni</button></div>` : '';
  if (variant === 'C') {
    body = `<div class="page">${adminHead()}<div class="settings">${subnav('MCP', [...ADMIN_ITEMS, ['MCP','plug']], 'Torna al profilo')}<div>${adminSectionC()}</div></div></div>`;
  } else {
    body = `<div class="page">${adminHead()}<div class="settings ${openPanel ? 'with-panel' : ''}">${subnav('Impostazioni', ADMIN_ITEMS, 'Torna al profilo')}<div><section class="section"><h2>Impostazioni</h2>${settingsRows(openPanel)}${confirm}</section></div>${openPanel ? mcpPanel() : ''}</div></div>`;
  }
  el.className = `app ${narrow ? 'narrow' : ''}`;
  el.innerHTML = narrow ? `<main class="main" style="grid-row:1/-1"><div class="page ${variant === 'C' ? 'solo' : ''}"><div class="push-head"><button class="btn-ghost press">${icon('chevL')}</button><span class="t">${variant === 'C' ? 'MCP' : variant === 'A' ? 'MCP' : 'Impostazioni'}</span></div>${variant === 'C' ? adminSectionC() : variant === 'A' ? mcpPanel().replace('class="panel"', 'class="panel pushed"') : `<section class="section">${settingsRows(false)}${confirm}</section>`}</div></main>` : `${topbar(true)}<main class="main">${body}</main>`;
  return `${HOST}/admin/${variant === 'C' ? 'mcp' : 'settings' + (openPanel ? '?edit=mcp' : '')}`;
}
function adminHead() {
  return `<div class="prof-head"><span class="big-avatar">${icon('shield')}</span><div class="who"><div class="n">Amministrazione</div><div class="e">Casa Gaye · saldo 0.4.0 · 4 account</div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  const desk = document.getElementById('desk'), narrow = document.getElementById('narrow');
  desk.dataset.theme = narrow.dataset.theme = S.theme;
  const fn = S.screen === 'apps' ? renderApps : S.screen === 'consent' ? renderConsent : renderAdmin;
  const url = fn(desk, false); fn(narrow, true);
  document.getElementById('url').textContent = url; document.getElementById('url2').textContent = url;
  document.getElementById('caption').innerHTML = `${CAPTIONS[S.screen][S.variant]} <span style="opacity:.7">Stato: ${SCREENS[S.screen].states.find(([id]) => id === S.state)[1]}.</span>`;
  document.getElementById('states').innerHTML = SCREENS[S.screen].states.map(([id, l]) => `<button data-v="${id}" aria-pressed="${S.state === id}">${l}</button>`).join('');
  for (const seg of document.querySelectorAll('.seg[data-k]')) for (const b of seg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(S[seg.dataset.k] === b.dataset.v));
  const p = new URLSearchParams({ screen: S.screen, variant: S.variant, state: S.state, theme: S.theme });
  history.replaceState(null, '', `?${p}`);
  document.title = `0.4 MCP — ${SCREENS[S.screen].title} — ${S.variant} · ${VARIANT_NAMES[S.screen][S.variant]}`;
}
document.querySelector('.toolbar').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  const k = b.closest('.seg').dataset.k; S[k] = b.dataset.v;
  if (k === 'screen' && !SCREENS[S.screen].states.some(([id]) => id === S.state)) S.state = SCREENS[S.screen].states[0][0];
  render();
});
document.querySelector('.stage').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const tog = e.target.closest('[data-toggle="write"]'); if (tog) { S.writeOn = !S.writeOn; render(); return; }
  const row = e.target.closest('.row[data-i]'); if (row && (S.variant === 'B' || S.variant === 'S') && S.screen === 'apps') { S.open = Number(row.dataset.i); render(); return; }
  const disc = e.target.closest('.disclosure'); if (disc) { S.disclosure = !S.disclosure; render(); return; }
  const sw = e.target.closest('.switch:not([disabled])'); if (sw && S.screen === 'admin') { S.state = S.state === 'off' ? 'on' : (S.variant === 'A' ? 'off' : 'confirm'); render(); }
});
render();
</script>
</body>
</html>
