<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saldo — Fuso orario nel Profilo · varianti</title>
<style>
  /* ---------- Saldo tokens (packages/ui/src/tokens.ts) ---------- */
  :root, [data-theme="dark"] {
    --page:#050505; --bg:#0A0A0A; --surface:#121212; --raised:#1A1A1A;
    --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.14);
    --text:#EDEDED; --text-muted:#8C8C8C; --text-faint:#5C5C5C;
    --accent:#C7C7C7; --on-accent:#0A0A0A; --track:#1E1E1E;
  }
  [data-theme="light"] {
    --page:#E9E9E7; --bg:#FFFFFF; --surface:#FAFAF9; --raised:#F1F1EF;
    --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14);
    --text:#171717; --text-muted:#6E6E6E; --text-faint:#9A9A9A;
    --accent:#4A4A46; --on-accent:#FFFFFF; --track:#EDEDEB;
  }
  :root { --ease:cubic-bezier(0.32, 0.72, 0, 1); --r-card:14px; --r-input:10px; --r-icon:8px; --pad:16px; --gap:10px; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:18px; padding:28px 16px 110px; background:#2a2a2a;
    font-family:Geist, "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
  .caption { font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:rgb(255 255 255 / .72); max-width:440px; text-align:center; text-wrap:pretty; }
  .caption b { color:#fff; font-weight:600; }

  .phone { width:390px; max-width:100%; height:844px; border-radius:54px; overflow:hidden; position:relative; background:var(--bg); color:var(--text);
    box-shadow:0 0 0 10px #000, 0 0 0 11px #333, 0 30px 80px rgb(0 0 0 / .5); display:flex; flex-direction:column; }
  .status { height:54px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 32px 0 40px; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  .island { position:absolute; top:11px; left:50%; translate:-50% 0; width:124px; height:36px; border-radius:20px; background:#000; z-index:30; }
  .scroll { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-bottom:48px; }
  .scroll::-webkit-scrollbar { display:none; }
  .content { padding:0 16px; display:flex; flex-direction:column; gap:var(--gap); }

  :focus-visible { outline:2px solid var(--text); outline-offset:2px; border-radius:var(--r-input); }
  .circ { width:36px; height:36px; border-radius:18px; background:var(--raised); display:grid; place-items:center; color:var(--text); flex:0 0 auto; transition:scale 120ms var(--ease); margin:8px 0 6px; }
  .circ:active, .li.tap:active, .btn:active { scale:.96; }
  .display { font-size:32px; font-weight:600; letter-spacing:-0.03em; line-height:1.15; }
  .muted { color:var(--text-muted); } .faint { color:var(--text-faint); }
  .body { font-size:15px; line-height:1.45; text-wrap:pretty; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); }
  .list { padding:8px var(--pad); }
  .li { width:100%; display:flex; align-items:center; gap:12px; min-height:48px; padding:8px 0; }
  .li + .li { border-top:1px solid var(--border); }
  .li.tap { transition:scale 120ms var(--ease); }
  .ib { width:28px; height:28px; border-radius:var(--r-icon); background:var(--raised); display:grid; place-items:center; flex:0 0 auto; color:var(--text-muted); }
  .li .txt { flex:1; min-width:0; }
  .li .ttl { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li .sub { font-size:13px; color:var(--text-muted); margin-top:2px; line-height:1.35; }
  .li .val { font-size:15px; color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .li .chev { color:var(--text-faint); display:flex; }
  .li .check { color:var(--accent); display:flex; width:16px; }
  svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  .chev svg.i { width:14px; height:14px; stroke-width:2; }
  .section { font-size:13px; color:var(--text-muted); margin:8px 4px 0; }

  .field { height:44px; display:flex; align-items:center; gap:8px; padding:0 12px; border-radius:var(--r-input); background:var(--raised); border:1px solid var(--border); color:var(--text-muted); }
  .field input { flex:1; min-width:0; height:100%; background:none; border:0; color:var(--text); font:inherit; font-size:15px; }
  .field input:focus { outline:none; }
  .field:focus-within { border-color:var(--border-strong); }

  /* Anteprima: the clock card on top of the list (radius 14 = 14 inner nothing: no nested surface) */
  .clock { padding:var(--pad); display:flex; flex-direction:column; gap:4px; }
  .clock .t { font-size:44px; font-weight:600; letter-spacing:-0.03em; line-height:52px; font-variant-numeric:tabular-nums; }
  .clock .d { font-size:15px; }
  .clock .n { font-size:13px; color:var(--text-muted); line-height:1.4; margin-top:8px; padding-top:10px; border-top:1px solid var(--border); text-wrap:pretty; }

  /* In viaggio: the notice. Card radius 14 around a 10-radius button with 4px inset → 14 = 10 + 4. */
  .notice { padding:12px 14px 4px; display:flex; flex-direction:column; gap:10px; }
  .notice .row { display:flex; gap:10px; align-items:flex-start; }
  .notice .row .ib { margin-top:1px; }
  .notice .actions { margin:0 -10px 0; padding:4px; display:flex; gap:4px; }
  .btn { flex:1; height:44px; border-radius:var(--r-input); font-size:15px; font-weight:500; display:grid; place-items:center; transition:scale 120ms var(--ease); }
  .btn.primary { background:var(--accent); color:var(--on-accent); }
  .btn.ghost { color:var(--text-muted); }

  .variant-picker { position:fixed; bottom:24px; left:50%; translate:-50% 0; z-index:2147483647; display:flex; gap:2px; padding:4px; border-radius:999px; background:rgb(20 20 20 / .9); box-shadow:inset 0 0 0 1px rgb(255 255 255 / .1), 0 8px 24px rgb(0 0 0 / .25); font:13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select:none; max-width:calc(100vw - 16px); overflow-x:auto; scrollbar-width:none; }
  .variant-picker button { white-space:nowrap; padding:7px 12px; border-radius:999px; color:rgb(255 255 255 / .6); }
  .variant-picker button:hover { color:rgb(255 255 255 / .85); }
  .variant-picker button[aria-current="true"], .variant-picker button[aria-pressed="true"] { background:rgb(255 255 255 / .14); color:#fff; }
  .variant-picker button:focus-visible { outline:2px solid rgb(255 255 255 / .7); outline-offset:2px; }
  .variant-picker .sep { width:1px; margin:4px; background:rgb(255 255 255 / .15); }
</style>
</head>
<body>
<p class="caption" id="caption"></p>
<div class="phone" id="phone" data-theme="dark">
  <div class="island"></div>
  <div class="status"><span id="clock">9:41</span><span style="font-size:13px">●●● ▮</span></div>
  <div class="scroll" id="scroll"></div>
</div>

<nav class="variant-picker" aria-label="Varianti">
  <button type="button" data-variant="quiet">1 · Silenziosa</button>
  <button type="button" data-variant="preview">2 · Anteprima</button>
  <button type="button" data-variant="travel">3 · Viaggio</button>
  <button type="button" data-variant="travelTime">4 · Viaggio + ora</button>
  <span class="sep"></span>
  <button type="button" id="trip" aria-pressed="false">A New York</button>
  <button type="button" id="theme">Tema</button>
</nav>

<script>
/* Icons: packages/ui/src/icons.ts */
const P = {
  chevL:'<path d="m14.5 18-6-6 6-6"/>', chevR:'<path d="m9.5 18 6-6-6-6"/>', check:'<path d="M20 6.5 9 17.5l-5-5"/>',
  search:'<circle cx="10.5" cy="10.5" r="7.5"/><path d="m21 21-4.3-4.3"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>',
  cal:'<rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/>',
  coins:'<circle cx="8.5" cy="8.5" r="5.5"/><path d="M14.8 6.2a5.5 5.5 0 1 1-6.6 8.6"/>',
  book:'<path d="M4 4.8A2.3 2.3 0 0 1 6.3 2.5h13.2v19H6.3A2.3 2.3 0 0 0 4 19.2z"/><path d="M4 17.4h15.5"/>',
  bulb:'<path d="M9.5 18.5h5M10.5 21.5h3"/><path d="M12 2.5a6 6 0 0 0-3.4 10.9v2.1h6.8v-2.1A6 6 0 0 0 12 2.5z"/>',
  plane:'<path d="M12 2.2c.8 0 1.4.9 1.4 2v5.4l7.6 4.2v2l-7.6-2.3v4l2.4 1.8v1.7L12 20l-3.8.9v-1.7l2.4-1.8v-4L3 15.8v-2l7.6-4.2V4.2c0-1.1.6-2 1.4-2z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* Real zones from the browser. City names: Italian for the common ones, IANA's English otherwise —
   the app needs CLDR exemplar cities for this; Intl has no API for them. */
const IT = { 'Europe/Rome':'Roma', 'Europe/London':'Londra', 'Europe/Paris':'Parigi', 'Europe/Berlin':'Berlino', 'Europe/Madrid':'Madrid',
  'Europe/Lisbon':'Lisbona', 'Europe/Stockholm':'Stoccolma', 'Europe/Zurich':'Zurigo', 'Europe/Athens':'Atene', 'Europe/Vienna':'Vienna',
  'Europe/Brussels':'Bruxelles', 'Europe/Amsterdam':'Amsterdam', 'Europe/Warsaw':'Varsavia', 'Europe/Moscow':'Mosca', 'Europe/Istanbul':'Istanbul',
  'America/New_York':'New York', 'America/Los_Angeles':'Los Angeles', 'America/Chicago':'Chicago', 'America/Sao_Paulo':'San Paolo',
  'America/Mexico_City':'Città del Messico', 'Asia/Tokyo':'Tokyo', 'Asia/Dubai':'Dubai', 'Asia/Singapore':'Singapore', 'Asia/Shanghai':'Shanghai',
  'Africa/Cairo':'Il Cairo', 'Africa/Dakar':'Dakar', 'Australia/Sydney':'Sydney', 'Pacific/Auckland':'Auckland', 'UTC':'UTC' };
const ZONES = (Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : Object.keys(IT)).filter((z) => z.includes('/') || z === 'UTC');
const city = (z) => IT[z] ?? z.split('/').pop().replaceAll('_', ' ');
const fmt = (z, o) => new Intl.DateTimeFormat('it-IT', { timeZone:z, ...o });
const part = (z, o, type) => fmt(z, o).formatToParts(new Date()).find((p) => p.type === type)?.value ?? '';
const offset = (z) => part(z, { timeZoneName:'shortOffset' }, 'timeZoneName');
const generic = (z) => part(z, { timeZoneName:'longGeneric' }, 'timeZoneName');
const time = (z) => fmt(z, { hour:'2-digit', minute:'2-digit' }).format(new Date());
const day = (z) => fmt(z, { weekday:'long', day:'numeric', month:'long' }).format(new Date());
const INFO = new Map(ZONES.map((z) => [z, { city:city(z), generic:generic(z), sort:city(z).toLocaleLowerCase('it') }]));
const SORTED = [...ZONES].sort((a, b) => INFO.get(a).sort.localeCompare(INFO.get(b).sort, 'it'));

/** «Settembre si chiude martedì 30»: the last day of the current month, in the saved zone. */
function periodEnd(z) {
  const y = Number(part(z, { year:'numeric' }, 'year')), m = Number(part(z, { month:'numeric' }, 'month'));
  const last = new Date(Date.UTC(y, m, 0, 12));
  const month = new Intl.DateTimeFormat('it-IT', { month:'long', timeZone:'UTC' }).format(last);
  const wd = new Intl.DateTimeFormat('it-IT', { weekday:'long', day:'numeric', timeZone:'UTC' }).format(last);
  return { month:month[0].toUpperCase() + month.slice(1), wd };
}

const CAPTIONS = {
  quiet:'<b>1 · Silenziosa</b> — una riga come Lingua e Valuta. La schermata è l’elenco di Valuta: ricerca, il fuso attuale in cima (e quello del telefono, se diverso), poi tutti A–Z con lo scarto da GMT. Una frase sotto il titolo e basta. All’onboarding il fuso si prende dal telefono senza chiedere.',
  preview:'<b>2 · Anteprima</b> — stessa riga. In cima alla schermata un orologio nel fuso scelto e la conseguenza in parole: quando si chiude il periodo. Ogni riga dell’elenco mostra l’ora locale, non lo scarto: si riconosce «dove sono le 23:40» più in fretta di «GMT−4».',
  travelTime:'<b>4 · Viaggio + ora</b> — la 3, con l’ora locale al posto dello scarto da GMT in ogni riga (dalla 2): si cerca «dove sono le 10:31», non «GMT−4». L’avviso e la riga del Profilo restano quelli della 3. Attiva «A New York» per vederlo.',
  travel:'<b>3 · Viaggio</b> — elenco come la 1. Parla solo quando il telefono e il fuso salvato non coincidono: la riga del Profilo lo dice sotto il valore, e la schermata apre con un avviso e «Usa New York». Attiva «A New York» nella barra per vederlo.',
};
const SUB = {
  quiet:'Serve per sapere che giorno è quando i conti li fa il server: sul web e con l’assistente.',
  preview:'Da qui dipende quando finisce un giorno, e con lui il periodo, sul web e con l’assistente.',
  travel:'Resta questo anche quando viaggi: il periodo si chiude a casa tua.',
  travelTime:'Resta questo anche quando viaggi: il periodo si chiude a casa tua.',
};

const $ = (id) => document.getElementById(id);
const TRAVEL = ['travel', 'travelTime'];
const S = { v:'quiet', screen:'profile', saved:'Europe/Rome', trip:false, query:'' };
const device = () => (S.trip ? 'America/New_York' : 'Europe/Rome');

function row({ lead, title, sub, value, chevron, onclick, selected, label }) {
  const tag = onclick ? 'button' : 'div';
  return `<${tag} ${onclick ? `type="button" class="li tap" onclick="${onclick}"` : 'class="li"'} ${label ? `aria-label="${label}"` : ''} ${selected !== undefined ? `aria-pressed="${selected}"` : ''}>
    ${lead ? `<span class="ib">${icon(lead)}</span>` : ''}
    <span class="txt"><span class="ttl" style="display:block">${title}</span>${sub ? `<span class="sub" style="display:block">${sub}</span>` : ''}</span>
    ${value !== undefined ? `<span class="val">${value}</span>` : ''}
    ${selected !== undefined ? `<span class="check">${selected ? icon('check') : ''}</span>` : ''}
    ${chevron ? `<span class="chev">${icon('chevR')}</span>` : ''}</${tag}>`;
}

function profile() {
  const away = TRAVEL.includes(S.v) && device() !== S.saved;
  return `<div class="content">
    <button type="button" class="circ" aria-label="Indietro">${icon('chevL')}</button>
    <div class="display">Profilo</div>
    <div class="card"><div class="list">
      ${row({ lead:'cal', title:'Inizio del ciclo', value:'dal 27', chevron:true, onclick:'' })}
      ${row({ lead:'coins', title:'Valuta', value:'€&nbsp;&nbsp;EUR', chevron:true, onclick:'' })}
      ${row({ lead:'book', title:'Lingua', value:'Sistema', chevron:true, onclick:'' })}
      ${row({ lead:'bulb', title:'Tema', value:'Sistema', chevron:true, onclick:'' })}
      ${row({ lead:'clock', title:'Fuso orario', sub: away ? `Il telefono è su ${city(device())}` : '', value:city(S.saved), chevron:true, onclick:"go('tz')" })}
    </div></div>
    <div class="card"><div class="list">
      ${['Budget', 'Obiettivi', 'Categorie', 'Gestisci tag', 'Conti archiviati', 'Guida'].map((t) => row({ title:t, chevron:true, onclick:'' })).join('')}
    </div></div>
  </div>`;
}

function zoneRow(z) {
  const i = INFO.get(z);
  const value = S.v === 'preview' || S.v === 'travelTime' ? time(z) : offset(z);
  return row({ title:i.city, sub:i.generic, value, selected: z === S.saved, onclick:`pick('${z}')` });
}

function tzScreen() {
  const q = S.query.trim().toLocaleLowerCase('it');
  const match = (z) => !q || INFO.get(z).sort.includes(q) || z.toLowerCase().includes(q) || INFO.get(z).generic.toLowerCase().includes(q);
  const all = SORTED.filter(match);
  // The saved zone is always on top, and the phone's when it differs: travelling must not bury the check under «R».
  const here = [...new Set([S.saved, device()])].filter(match);
  const away = TRAVEL.includes(S.v) && device() !== S.saved;
  const end = periodEnd(S.saved);

  const top = {
    quiet:'',
    preview:`<div class="card clock" aria-live="polite">
      <div class="muted" style="font-size:13px">Adesso a ${city(S.saved)}</div>
      <div class="t">${time(S.saved)}</div><div class="d">${day(S.saved)}</div>
      <div class="n">${end.month} si chiude ${end.wd} a mezzanotte, ora di ${city(S.saved)}.</div></div>`,
    travel: '',
  }[S.v] ?? '';
  const notice = away ? `<div class="card notice" role="status">
      <div class="row"><span class="ib">${icon('plane')}</span>
        <div class="body">Il telefono è su <b>${city(device())}</b>, dove sono le ${time(device())}. I conti restano su ${city(S.saved)} finché non lo cambi.</div></div>
      <div class="actions"><button type="button" class="btn primary" onclick="pick('${device()}')">Usa ${city(device())}</button></div></div>` : '';

  return `<div class="content">
    <button type="button" class="circ" aria-label="Indietro" onclick="go('profile')">${icon('chevL')}</button>
    <div class="display">Fuso orario</div>
    <div class="muted body">${SUB[S.v]}</div>
    ${top}${notice}
    <label class="field">${icon('search')}<input id="q" type="search" placeholder="Cerca una città" aria-label="Cerca una città" value="${S.query.replaceAll('"', '&quot;')}" autocomplete="off" oninput="S.query=this.value;draw(true)"></label>
    ${here.length ? `<div class="section">${here.length > 1 ? 'Attuale e questo telefono' : 'Attuale'}</div><div class="card"><div class="list">${here.map(zoneRow).join('')}</div></div>` : ''}
    ${all.length ? `<div class="section">Tutti</div><div class="card"><div class="list">${all.map(zoneRow).join('')}</div></div>`
      : `<div class="muted body" style="margin:8px 4px">Nessuna città trovata.</div>`}
  </div>`;
}

function draw(keepFocus) {
  const caret = keepFocus ? $('q')?.selectionStart : null;
  $('scroll').innerHTML = S.screen === 'profile' ? profile() : tzScreen();
  if (keepFocus) { const q = $('q'); q.focus(); q.setSelectionRange(caret, caret); }
}
function render() {
  $('caption').innerHTML = CAPTIONS[S.v];
  document.querySelectorAll('[data-variant]').forEach((b) => b.setAttribute('aria-current', String(b.dataset.variant === S.v)));
  $('trip').setAttribute('aria-pressed', String(S.trip));
  $('clock').textContent = fmt(device(), { hour:'numeric', minute:'2-digit' }).format(new Date());
  draw(false);
}
function go(s) { S.screen = s; S.query = ''; render(); $('scroll').scrollTop = 0; }
function pick(z) { S.saved = z; const top = $('scroll').scrollTop; draw(false); $('scroll').scrollTop = top; }
function syncUrl() { const u = new URL(location); u.searchParams.set('variant', S.v); S.trip ? u.searchParams.set('trip', '1') : u.searchParams.delete('trip');
  u.searchParams.set('screen', S.screen); history.replaceState(null, '', u); }
function select(v) { S.v = v; syncUrl(); render(); }

const ORDER = ['quiet', 'preview', 'travel', 'travelTime'];
document.querySelectorAll('[data-variant]').forEach((b) => b.addEventListener('click', () => select(b.dataset.variant)));
$('trip').addEventListener('click', () => { S.trip = !S.trip; syncUrl(); render(); });
$('theme').addEventListener('click', () => { $('phone').dataset.theme = $('phone').dataset.theme === 'dark' ? 'light' : 'dark'; });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const i = ORDER.indexOf(S.v);
  if (e.key === 'ArrowRight') select(ORDER[(i + 1) % ORDER.length]);
  if (e.key === 'ArrowLeft') select(ORDER[(i + ORDER.length - 1) % ORDER.length]);
  if (/^[1-4]$/.test(e.key)) select(ORDER[Number(e.key) - 1]);
  if (e.key === 'v') $('trip').click();
  if (e.key === 't') $('theme').click();
});
const params = new URL(location).searchParams;
S.v = ORDER.includes(params.get('variant')) ? params.get('variant') : 'quiet';
S.trip = params.get('trip') === '1';
S.screen = params.get('screen') === 'tz' ? 'tz' : 'profile';
const _go = go; window.go = (s) => { _go(s); syncUrl(); };
syncUrl(); render();
setInterval(() => { if (document.activeElement?.id !== 'q') { const top = $('scroll').scrollTop; render(); $('scroll').scrollTop = top; } }, 30000);
</script>
</body>
</html>
