<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saldo · Onboarding · varianti Sfoglia / Registro / Fuoco / Pila</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ---------- tokens: copied from packages/ui/src/tokens.ts ---------- */
:root {
  --font: 'Geist', 'Inter Tight', system-ui, sans-serif;
  --r-iconbox: 8px; --r-chip: 9px; --r-input: 10px; --r-button: 12px; --r-card: 14px; --r-pill: 999px;
  --fs-caption: 11px; --fs-footnote: 13px; --fs-body: 15px; --fs-headline: 17px; --fs-amount-key: 22px;
  --fs-title: 24px; --fs-amount-lg: 32px; --fs-display: 34px; --fs-hero: 44px;
  --pad-x: 16px; --card-pad: 16px; --card-gap: 10px;
  /* motion: project easing for anything that moves in space; the ease-out below for fades and blur */
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --press-ms: 150ms; --fade-ms: 200ms; --progress-ms: 300ms; --toggle-ms: 180ms;
  --c0:#C57B4E; --c1:#B4894A; --c2:#8F9152; --c3:#63926F; --c4:#4F8D8B; --c5:#5A82A6; --c6:#7A79AC; --c7:#A06FA0; --c8:#AF6B7B; --c9:#8A8A8A;
}
[data-theme="dark"] {
  --page:#050505; --bg:#0A0A0A; --surface:#121212; --raised:#1A1A1A;
  --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.12);
  --text:#EDEDED; --text-muted:#8C8C8C; --text-faint:#5C5C5C;
  --accent:#C7C7C7; --on-accent:#0A0A0A; --positive:#5FBF7F; --bar-grey:#3A3A3A; --track:#1E1E1E;
  color-scheme: dark;
}
[data-theme="light"] {
  --page:#E9E9E7; --bg:#FFFFFF; --surface:#FAFAF9; --raised:#F1F1EF;
  --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.18);
  --text:#171717; --text-muted:#6E6E6E; --text-faint:#9A9A9A;
  --accent:#4A4A46; --on-accent:#FFFFFF; --positive:#2E8A50; --bar-grey:#C9C9C6; --track:#EDEDEB;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); background: var(--page); color: var(--text);
  -webkit-font-smoothing: antialiased; text-wrap: pretty;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: start; }
input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.tabular { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- stage ---------- */
.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 24px 120px; }
.stage-label {
  position: fixed; top: 20px; left: 24px; right: 24px; font-size: var(--fs-footnote); color: var(--text-muted);
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
}
.stage-label b { color: var(--text); font-weight: 600; font-size: var(--fs-headline); letter-spacing: -0.02em; }
.stage-label kbd { font: inherit; color: var(--text-faint); }

.phone {
  width: 390px; height: 844px; border-radius: 48px; background: var(--bg); overflow: hidden; position: relative;
  box-shadow: 0 0 0 1px var(--border-strong), 0 30px 80px -20px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; isolation: isolate;
}
.statusbar { height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px; font-size: 15px; font-weight: 600; flex: none; }
.island { position: absolute; top: 12px; left: 50%; translate: -50% 0; width: 122px; height: 36px; border-radius: 20px; background: #000; z-index: 6; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 134px; height: 5px; border-radius: 3px; background: var(--text); opacity: 0.9; z-index: 5; pointer-events: none; }

/* ---------- screen ---------- */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.progress, .segments { transition: opacity var(--fade-ms) var(--ease-out); }
.progress { height: 2px; background: var(--track); flex: none; margin: 0 var(--pad-x); border-radius: 1px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width var(--progress-ms) var(--ease); }
.segments { display: flex; gap: 6px; padding: 0 var(--pad-x); flex: none; }
.segments > i { flex: 1; height: 2px; border-radius: 1px; background: var(--track); overflow: hidden; }
.segments > i > b { display: block; height: 100%; background: var(--accent); width: 0; transition: width var(--progress-ms) var(--ease); }
.segments > i.done > b { width: 100%; }
.segments > i.now > b { width: 100%; }

.pages { flex: 1; min-height: 0; position: relative; }
.page {
  position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0;
  will-change: transform, opacity;
}
.page .body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px var(--pad-x) 24px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
.page .body::-webkit-scrollbar { display: none; }
.chunk { will-change: transform, opacity, filter; }

.caption { font-size: var(--fs-caption); color: var(--text-faint); }
.title { font-size: var(--fs-display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; }
.title .w { display: inline-block; will-change: transform, opacity, filter; }
.lead { font-size: var(--fs-body); color: var(--text-muted); line-height: 1.4; }

/* footer */
.footer { flex: none; padding: 12px var(--pad-x) 34px; display: flex; gap: 12px; align-items: center; background: var(--bg); }
.btn {
  height: 48px; border-radius: var(--r-button); font-size: var(--fs-body); font-weight: 500; letter-spacing: -0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
  transition-property: scale, background-color, color, opacity; transition-duration: var(--press-ms); transition-timing-function: var(--ease-out);
}
.btn:active { scale: 0.96; }
.btn.primary { flex: 1; background: var(--accent); color: var(--on-accent); }
.btn.primary[aria-disabled="true"] { background: var(--raised); color: var(--text-faint); }
.btn.ghost { color: var(--text-muted); padding: 0 12px; }
.btn.ghost:hover { color: var(--text); }
.btn .label { position: relative; display: grid; }
.btn .label > span { grid-area: 1/1; transition: opacity var(--fade-ms) var(--ease-out), filter var(--fade-ms) var(--ease-out); }
.btn .label > span[hidden] { display: block; opacity: 0; filter: blur(4px); pointer-events: none; }

/* card + rows (mirror apps/mobile/src/components) */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--card-pad); }
.card.flush { padding: 4px var(--card-pad); }
.row {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border);
  transition: opacity var(--press-ms) var(--ease-out);
}
.row:last-child { border-bottom: 0; }
.row:active { opacity: 0.7; }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .t { font-size: var(--fs-body); letter-spacing: -0.01em; }
.row .s { font-size: var(--fs-footnote); color: var(--text-muted); line-height: 1.35; }
.row .chev { color: var(--text-faint); }
.row .tick { width: 18px; height: 18px; color: var(--accent); display: grid; place-items: center; }
.row .tick svg { transition: opacity var(--fade-ms) var(--ease-out), scale var(--fade-ms) var(--ease-out), filter var(--fade-ms) var(--ease-out); }
.row .tick[data-on="false"] svg { opacity: 0; scale: 0.25; filter: blur(4px); }

/* day grid, revealed only for the pay cycle */
.reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 280ms var(--ease), opacity var(--fade-ms) var(--ease-out); opacity: 0; }
.reveal[data-open="true"] { grid-template-rows: 1fr; opacity: 1; }
.reveal > div { min-height: 0; overflow: hidden; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.day {
  height: 40px; border-radius: var(--r-chip); background: var(--raised); display: grid; place-items: center; font-size: var(--fs-footnote);
  transition-property: scale, background-color, color; transition-duration: var(--press-ms); transition-timing-function: var(--ease-out);
}
.day:active { scale: 0.96; }
.day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.field-label { font-size: var(--fs-footnote); color: var(--text-muted); }

/* account */
.input {
  width: 100%; height: 48px; padding: 0 14px; border-radius: var(--r-input); background: var(--raised); border: 1px solid var(--border-strong);
  font-size: var(--fs-headline); letter-spacing: -0.01em; outline-offset: 0;
}
.input::placeholder { color: var(--text-faint); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 9px; padding: 12px; min-height: 74px;
  border-radius: var(--r-input); border: 1px solid var(--border); color: var(--text-muted);
  transition-property: scale, background-color, border-color, color, opacity; transition-duration: var(--press-ms); transition-timing-function: var(--ease-out);
}
.tile:active { scale: 0.96; }
.tile[aria-pressed="true"], .tile[aria-checked="true"] { background: var(--raised); border-color: var(--border-strong); color: var(--text); }
.tile .lbl { font-size: var(--fs-caption); line-height: 1.25; }
.tile .tick { position: absolute; top: 8px; right: 8px; color: var(--accent); }
.tile .tick svg { transition: opacity var(--fade-ms) var(--ease-out), scale var(--fade-ms) var(--ease-out), filter var(--fade-ms) var(--ease-out); }
.tile[aria-pressed="false"] .tick svg, .tile[aria-checked="false"] .tick svg { opacity: 0; scale: 0.25; filter: blur(4px); }

/* categories */
.cat { align-items: center; gap: 6px; padding: 12px 8px; min-height: 0; }
.cat .lbl { width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.cat[aria-checked="false"] { opacity: 0.45; }
.cat[aria-checked="true"] { background: color-mix(in srgb, var(--cc) 14%, transparent); }

/* balance */
.amount { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 4px; }
.amount .num { flex: 1; min-width: 0; font-size: var(--fs-display); font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; display: inline-flex; align-items: baseline; }
.amount .num .g { display: inline-block; }
.amount .num .g.in { animation: digitIn 200ms var(--ease-out) both; }
.amount .num .dec { opacity: 0.5; }
.amount .num.neg { color: var(--text-muted); }
.amount .cur {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: var(--r-input);
  background: var(--raised); border: 1px solid var(--border); font-size: var(--fs-footnote); color: var(--text-muted); margin-bottom: 4px;
  transition: scale var(--press-ms) var(--ease-out);
}
.amount .cur:active { scale: 0.96; }
@keyframes digitIn { from { opacity: 0; transform: translateY(40%); } to { opacity: 1; transform: none; } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 52px; gap: 6px; padding: 0 12px 10px; flex: none; }
.key {
  border-radius: var(--r-input); background: var(--raised); border: 1px solid var(--border); display: grid; place-items: center;
  font-size: var(--fs-amount-key); font-weight: 500; color: var(--text);
  transition-property: scale, background-color; transition-duration: var(--press-ms); transition-timing-function: var(--ease-out);
}
.key:active { scale: 0.96; background: var(--surface); }
.key.soft { color: var(--text-muted); }

/* ---------- Registro: the ledger of answers ---------- */
.ledger { padding: 4px var(--pad-x) 0; display: flex; flex-direction: column; flex: none; }
.ledger .entry {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 0; border-bottom: 1px solid var(--border);
  font-size: var(--fs-footnote); will-change: transform, opacity;
}
.ledger .entry .k { color: var(--text-faint); flex: none; min-width: 64px; }
.ledger .entry .v { color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ledger .entry .chev { color: var(--text-faint); }
.ledger .entry:active { opacity: 0.7; }
[data-variant="registro"] .page .body { padding-top: 22px; }

/* ---------- Fuoco: one thing, centred ---------- */
[data-variant="fuoco"] .page .body { justify-content: center; padding-top: 0; }
[data-variant="fuoco"] .page .body.tall { justify-content: flex-start; padding-top: 28px; }
[data-variant="fuoco"] .title { font-size: var(--fs-hero); letter-spacing: -0.03em; line-height: 1.05; }
[data-variant="fuoco"] .lead { font-size: var(--fs-headline); }

/* ---------- Pila: sheets stacked in depth ---------- */
[data-variant="pila"] .pages { background: var(--page); }
[data-variant="pila"] .page {
  top: 28px; background: var(--bg); border-radius: 20px 20px 0 0; transform-origin: 50% 0;
  box-shadow: 0 -1px 0 var(--border-strong), 0 -12px 32px -12px rgba(0,0,0,0.45);
  transition: transform 350ms var(--ease);
}
/* Sheets below dim through a scrim, not opacity: an opaque sheet must hide the ones under it. */
[data-variant="pila"] .page::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
  background: var(--page); opacity: var(--dim, 0); transition: opacity 350ms var(--ease);
}
[data-variant="pila"] .page .body { padding-top: 24px; }
[data-variant="pila"] .page[inert] { pointer-events: none; }

/* ---------- done card ---------- */
.done { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* ---------- reduced motion: keep opacity, drop movement ---------- */
@media (prefers-reduced-motion: reduce) {
  .progress > i, .segments > i > b { transition-duration: 0ms; }
  .reveal { transition: opacity var(--fade-ms) var(--ease-out); }
  .btn:active, .day:active, .tile:active, .key:active, .amount .cur:active { scale: 1; }
  .amount .num .g.in { animation: none; }
  [data-variant="pila"] .page { transition: none; }
}

/* ---------- picker (deliberately outside the design system) ---------- */
.variant-picker {
  position: fixed; bottom: 24px; left: 50%; translate: -50% 0; z-index: 2147483647;
  display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgb(20 20 20 / 0.9);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1), 0 8px 24px rgb(0 0 0 / 0.25);
  font: 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; align-items: center;
}
.variant-picker button { padding: 7px 14px; border: 0; border-radius: 999px; background: none; color: rgb(255 255 255 / 0.6); cursor: pointer; font: inherit; }
.variant-picker button:hover { color: rgb(255 255 255 / 0.85); }
.variant-picker button[aria-current="true"] { background: rgb(255 255 255 / 0.14); color: rgb(255 255 255); }
.variant-picker button[aria-pressed="true"] { color: rgb(255 255 255); }
.variant-picker button:focus-visible { outline: 2px solid rgb(255 255 255 / 0.7); outline-offset: 2px; }
.variant-picker .sep { width: 1px; height: 18px; background: rgb(255 255 255 / 0.15); margin: 0 4px; }
</style>
</head>

  periodTitle: 'Come segui le spese?', periodBody: 'Scegli la finestra in cui i numeri ripartono. Puoi cambiarla quando vuoi.',
  cycleStartDay: 'Il giorno in cui inizia il ciclo', periodTimeline: 'In questo momento va dal {s} al {e}',
  accountTitle: 'Il tuo primo conto', accountBody: 'Puoi aggiungerne altri quando vuoi.', accountName: 'Nome', accountNamePlaceholder: 'Conto', accountType: 'Tipo',
  balanceTitle: 'Quanto hai adesso?', balanceBody: 'Il saldo attuale del conto. Puoi correggerlo in qualsiasi momento.', accountBalance: 'Saldo attuale',
  categoriesTitle: 'Scegli le tue categorie', categoriesBody: 'Le useremo per organizzare le spese. Potrai modificarle dopo.', categoriesSelected: '{n} selezionate',
  step: 'Passo {c} di {t}', cont: 'Continua', back: 'Indietro', start: 'Inizia',
  ledger: { period: 'Periodo', account: 'Conto', balance: 'Saldo' },
  doneTitle: 'Tutto pronto', doneBody: 'Da qui l’app entra nella Home. Nel prototipo il flusso ricomincia con R.',
};
const PERIODS = [
  { id: 'month', t: 'Mese solare', s: 'Dal 1° alla fine del mese' },
  { id: 'week', t: 'Settimana', s: 'Da lunedì a domenica' },
  { id: 'cycle', t: 'Ciclo di stipendio', s: 'Da un giorno che scegli tu al giorno prima, il mese dopo' },
  { id: 'year', t: 'Anno', s: 'Dal 1° gennaio al 31 dicembre' },
];
const TYPES = [
  { id: 'cash', t: 'Contanti', i: 'coins' }, { id: 'checking', t: 'Conto', i: 'landmark' }, { id: 'debit_card', t: 'Carta di debito', i: 'card' },
  { id: 'credit_card', t: 'Carta di credito', i: 'card' }, { id: 'savings', t: 'Risparmi', i: 'piggy' }, { id: 'investment', t: 'Investimenti', i: 'trend' },
];
const CATS = [
  ['groceries','Spesa','cart',0],['home','Casa','house',1],['transport','Trasporti','train',2],['utilities','Utenze','zap',3],
  ['restaurants','Ristoranti','utensils',4],['health','Salute','heart',5],['sport','Sport','dumbbell',6],['shopping','Shopping','bag',7],
  ['leisure','Tempo libero','film',8],['subscriptions','Abbonamenti','monitor',9],['education','Formazione','cap',6],['salary','Stipendio','landmark',5],
];
const STEPS = ['start', 'period', 'account', 'balance', 'categories', 'done'];
const NUMBERED = ['period', 'account', 'balance', 'categories'];

/* ---------- state ---------- */
const VARIANTS = ['sfoglia', 'registro', 'fuoco', 'pila'];
const AXIS = {
  sfoglia: 'asse: modello spaziale → pagine che scorrono in orizzontale, la barra 2px in alto resta',
  registro: 'asse: modello spaziale → le risposte si accumulano in alto come un registro, la domanda successiva sale',
  fuoco: 'asse: modello spaziale → una cosa sola al centro, cambio in loco per fusione, segmenti al posto della barra',
  pila: 'asse: modello spaziale → in profondità: ogni step è un foglio che sale sopra il precedente, i bordi dei fogli sotto sono il progresso',
};
let SPEED = 1;
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const ms = (n) => n * SPEED;
const state = { i: 0, periodKind: 'month', day: 27, accountName: '', accountType: 'checking', neg: false, buf: '', currency: 'EUR', cats: new Set(CATS.map(c => c[0])) };
let busy = false;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const fmtDate = (d) => d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
function periodPreview() {
  const now = new Date(2026, 8, 22);
  let s, e;
  if (state.periodKind === 'month') { s = new Date(2026, 8, 1); e = new Date(2026, 8, 30); }
  else if (state.periodKind === 'week') { s = new Date(2026, 8, 21); e = new Date(2026, 8, 27); }
  else if (state.periodKind === 'year') { s = new Date(2026, 0, 1); e = new Date(2026, 11, 31); }
  else { const d = state.day; s = now.getDate() >= d ? new Date(2026, 8, d) : new Date(2026, 7, d); e = new Date(s.getFullYear(), s.getMonth() + 1, d - 1); }
  return T.periodTimeline.replace('{s}', fmtDate(s)).replace('{e}', fmtDate(e));
}
function fmtAmount() {
  const buf = state.buf.length ? state.buf : '0';
  const [int, dec = ''] = buf.split(',');
  const intFmt = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return { int: (state.neg && buf !== '0' ? '−' : '') + intFmt, dec: (dec + '00').slice(0, 2), hasDec: buf.includes(',') };
}
const periodLabel = () => { const p = PERIODS.find(p => p.id === state.periodKind); return state.periodKind === 'cycle' ? `${p.t}, dal ${state.day}` : p.t; };
const accountLabel = () => `${state.accountName || 'Conto principale'} · ${TYPES.find(t => t.id === state.accountType).t}`;
const balanceLabel = () => { const a = fmtAmount(); return `${a.int},${a.dec} €`; };
const words = (s) => s.split(' ').map(w => `<span class="w">${w}</span>`).join(' ');

/* ---------- step content (shared across variants; the variant decides how it arrives) ---------- */
function header(step) {
  const n = NUMBERED.indexOf(step) + 1;
  const v = document.body.dataset.variant;
  const titles = { start: T.startTitle, period: T.periodTitle, account: T.accountTitle, balance: T.balanceTitle, categories: T.categoriesTitle, done: T.doneTitle };
  const leads = { start: T.startBody, period: T.periodBody, account: T.accountBody, balance: T.balanceBody, categories: T.categoriesBody, done: T.doneBody };
  const caption = n > 0 && v !== 'fuoco' ? `<div class="caption tabular chunk">${T.step.replace('{c}', n).replace('{t}', 4)}</div>` : '';
  const title = v === 'fuoco' ? words(titles[step]) : titles[step];
  return `${caption}<h1 class="title chunk" data-title>${title}</h1><p class="lead chunk">${leads[step]}</p>`;
}

function contentFor(step) {
  if (step === 'start') return `
    <div class="card flush chunk">
      <button class="row" data-act="fresh"><span class="txt"><span class="t">${T.startFresh}</span><span class="s">${T.startFreshHint}</span></span><span class="chev">${ic('chevR', 18)}</span></button>
      <button class="row" data-act="noop"><span class="txt"><span class="t">${T.startImport}</span><span class="s">${T.startImportHint}</span></span><span class="chev">${ic('chevR', 18)}</span></button>
      <button class="row" data-act="noop"><span class="txt"><span class="t">${T.startRestore}</span><span class="s">${T.startRestoreHint}</span></span><span class="chev">${ic('chevR', 18)}</span></button>
    </div>`;
  if (step === 'period') return `
    <div class="card flush chunk" role="radiogroup" aria-label="${T.periodTitle}">
      ${PERIODS.map(p => `<button class="row" role="radio" aria-checked="${p.id === state.periodKind}" data-period="${p.id}">
        <span class="txt"><span class="t">${p.t}</span><span class="s">${p.s}</span></span>
        <span class="tick" data-on="${p.id === state.periodKind}">${ic('check', 18)}</span></button>`).join('')}
    </div>
    <div class="reveal chunk" data-open="${state.periodKind === 'cycle'}" ${state.periodKind === 'cycle' ? '' : 'inert'}>
      <div><div class="card">
        <div class="field-label">${T.cycleStartDay}</div>
        <div class="days" role="group" aria-label="${T.cycleStartDay}">${Array.from({ length: 28 }, (_, i) => i + 1).map(d => `<button class="day tabular" aria-pressed="${d === state.day}" data-day="${d}">${d}</button>`).join('')}</div>
      </div></div>
    </div>
    <div class="caption tabular chunk" data-preview>${periodPreview()}</div>`;
  if (step === 'account') return `
    <div class="card chunk" style="display:flex;flex-direction:column;gap:14px">
      <label style="display:flex;flex-direction:column;gap:8px"><span class="field-label">${T.accountName}</span>
        <input class="input" data-name placeholder="${T.accountNamePlaceholder}" value="${state.accountName}" autocomplete="off" /></label>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="field-label" id="type-label">${T.accountType}</span>
        <div class="tiles" role="radiogroup" aria-labelledby="type-label">${TYPES.map(t => `<button class="tile" role="radio" aria-checked="${t.id === state.accountType}" data-type="${t.id}">${ic(t.i, 20)}<span class="lbl">${t.t}</span><span class="tick">${ic('check', 14)}</span></button>`).join('')}</div>
      </div>
    </div>`;
  if (step === 'balance') { const a = fmtAmount(); return `
    <div class="card chunk">
      <div class="field-label">${T.accountBalance}</div>
      <div class="amount">
        <output class="num tabular ${state.neg ? 'neg' : ''}" data-amount aria-live="polite" aria-label="${T.accountBalance}">${a.int.split('').map(ch => `<span class="g">${ch}</span>`).join('')}<span class="dec">,${a.dec} €</span></output>
        <button class="cur" data-act="noop" aria-label="Valuta: ${state.currency}"><span>${state.currency}</span>${ic('chevD', 14)}</button>
      </div>
    </div>`; }
  if (step === 'categories') return `
    <div class="caption tabular chunk" data-count>${T.categoriesSelected.replace('{n}', state.cats.size)}</div>
    <div class="card chunk"><div class="tiles" role="group" aria-label="${T.categoriesTitle}">${CATS.map(([id, t, i, c]) => `<button class="tile cat" role="checkbox" aria-checked="${state.cats.has(id)}" data-cat="${id}" style="--cc:var(--c${c})"><span style="color:var(--c${c});display:flex">${ic(i, 20)}</span><span class="lbl">${t}</span></button>`).join('')}</div></div>`;
  if (step === 'done') return `<div class="done chunk"><button class="btn primary" data-act="restart" style="flex:none;padding:0 20px">Ricomincia</button></div>`;
  return '';
}

function keypad() {
  const keys = ['1','2','3','4','5','6','7','8','9',',','0','⌫'];
  return `<div class="keypad" role="group" aria-label="Tastierino">${keys.map(k => k === '⌫'
    ? `<button class="key soft" data-key="del" aria-label="Cancella">${ic('back', 22)}</button>`
    : `<button class="key tabular ${k === ',' ? 'soft' : ''}" data-key="${k}">${k}</button>`).join('')}
    </div>`;
}

function footer(step) {
  if (step === 'start' || step === 'done') return '';
  const last = step === 'categories';
  return `<div class="footer">
    <button class="btn ghost" data-act="back">${T.back}</button>
    <button class="btn primary" data-act="next"><span class="label"><span ${last ? 'hidden' : ''}>${T.cont}</span><span ${last ? '' : 'hidden'}>${T.start}</span></span></button>
  </div>`;
}

function buildPage(step) {
  const tall = step === 'account' || step === 'categories' || step === 'period';
  const page = el(`<section class="page" data-step="${step}" aria-labelledby="h-${step}">
    <div class="body ${tall ? 'tall' : ''}">${header(step)}${contentFor(step)}</div>
    ${step === 'balance' ? keypad() : ''}
    ${footer(step)}
  </section>`);
  page.querySelector('[data-title]').id = `h-${step}`;
  return page;
}

/* ---------- progress per variant ---------- */
function buildChrome(v) {
  if (v === 'sfoglia') return `<div class="progress" aria-hidden="true"><i></i></div>`;
  if (v === 'registro') return `<div class="ledger" aria-label="Risposte date" role="list"></div>`;
  if (v === 'pila') return '';
  return `<div class="segments" aria-hidden="true">${NUMBERED.map(() => '<i><b></b></i>').join('')}</div>`;
}
function updateProgress() {
  const step = STEPS[state.i];
  const n = NUMBERED.indexOf(step) + 1;
  document.querySelectorAll('.progress, .segments').forEach(c => { c.style.opacity = n === 0 ? '0' : ''; });
  const bar = $('.progress > i'); if (bar) bar.style.width = `${(n / 4) * 100}%`;
  const segs = document.querySelectorAll('.segments > i');
  segs.forEach((s, k) => { s.classList.toggle('done', k + 1 < n); s.classList.toggle('now', k + 1 === n); });
}

/* ---------- Registro ledger ---------- */
function ledgerEntries() {
  const out = [];
  if (state.i > 1) out.push({ key: 'period', k: T.ledger.period, v: periodLabel() });
  if (state.i > 2) out.push({ key: 'account', k: T.ledger.account, v: accountLabel() });
  if (state.i > 3) out.push({ key: 'balance', k: T.ledger.balance, v: balanceLabel() });
  return out;
}
function renderLedger() {
  const l = $('.ledger'); if (!l) return;
  l.innerHTML = ledgerEntries().map(e => `<button class="entry" role="listitem" data-jump="${e.key}" aria-label="${e.k}: ${e.v}. Modifica"><span class="k">${e.k}</span><span class="v">${e.v}</span><span class="chev">${ic('chevR', 14)}</span></button>`).join('');
}

/* ---------- transitions ---------- */
function stagger(page, { from = 12, dur = 400, gap = 100, wordsToo = false, skipTitle = false } = {}) {
  if (reduce()) { page.querySelectorAll('.chunk').forEach((c, k) => c.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(200), delay: ms(k * 60), fill: 'backwards', easing: 'ease-out' })); return; }
  const chunks = [...page.querySelectorAll('.chunk')].filter(c => !(skipTitle && c.hasAttribute('data-title')));
  chunks.forEach((c, k) => {
    if (wordsToo && c.hasAttribute('data-title')) {
      c.style.opacity = '';
      [...c.querySelectorAll('.w')].forEach((w, j) => w.animate(
        [{ opacity: 0, transform: `translateY(${from}px)`, filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
        { duration: ms(dur), delay: ms(k * gap + j * 80), fill: 'backwards', easing: 'cubic-bezier(0.2, 0, 0, 1)' }));
      return;
    }
    c.animate([{ opacity: 0, transform: `translateY(${from}px)`, filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
      { duration: ms(dur), delay: ms(k * gap), fill: 'backwards', easing: 'cubic-bezier(0.2, 0, 0, 1)' });
  });
}
// Never hang on an animation: a cancelled or throttled one would otherwise leave `busy` stuck.
const finished = (a) => Promise.race([a.finished.catch(() => {}), new Promise(r => setTimeout(r, (a.effect.getTiming().duration || 0) + (a.effect.getTiming().delay || 0) + 50))]);

async function transitionSfoglia(oldP, newP, dir) {
  const pages = $('.pages'); pages.append(newP);
  if (reduce()) { oldP.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(150), fill: 'forwards' }); await finished(newP.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(200), fill: 'forwards' })); return; }
  // iOS push: the new sheet covers, the old one parks a third of the way under it. Back reverses.
  const D = ms(350), E = 'cubic-bezier(0.32, 0.72, 0, 1)';
  const a1 = newP.animate([{ transform: `translateX(${dir > 0 ? '100%' : '-30%'})`, opacity: dir > 0 ? 1 : 0.6 }, { transform: 'none', opacity: 1 }], { duration: D, easing: E, fill: 'both' });
  const a2 = oldP.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${dir > 0 ? '-30%' : '100%'})`, opacity: dir > 0 ? 0.6 : 1 }], { duration: D, easing: E, fill: 'forwards' });
  if (dir > 0) newP.style.boxShadow = '-12px 0 32px -12px rgba(0,0,0,0.35)';
  await Promise.all([finished(a1), finished(a2)]);
  newP.style.boxShadow = '';
}

async function transitionRegistro(oldP, newP, dir) {
  const pages = $('.pages'); pages.append(newP);
  const E = 'cubic-bezier(0.32, 0.72, 0, 1)', OUT = 'cubic-bezier(0.2, 0, 0, 1)';
  const oldTitle = oldP.querySelector('[data-title]');
  const oldChunks = [...oldP.querySelectorAll('.chunk')].filter(c => c !== oldTitle);
  const oldStep = oldP.dataset.step, newStep = newP.dataset.step;
  if (reduce()) {
    oldP.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(150), fill: 'forwards' });
    renderLedger(); await finished(newP.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(200), fill: 'forwards' })); return;
  }
  // Going back: remember where the row we are about to re-open sits, before the ledger re-renders.
  const leaving = dir < 0 ? $(`.ledger .entry[data-jump="${newStep}"]`) : null;
  const leavingRect = leaving ? leaving.getBoundingClientRect() : null;
  // 1. the rest of the old question leaves, softly (exit shorter than enter)
  oldChunks.forEach(c => c.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(-12px)', filter: 'blur(4px)' }], { duration: ms(150), easing: OUT, fill: 'forwards' }));
  oldP.querySelectorAll('.footer, .keypad').forEach(f => f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(150), fill: 'forwards' }));
  renderLedger();
  newP.style.opacity = '0';
  const entry = dir > 0 ? $(`.ledger .entry[data-jump="${oldStep}"]`) : null;
  if (entry) {
    // 2a. forward: the answer settles into the ledger — FLIP from the title's box to the new row's box
    const from = oldTitle.getBoundingClientRect(), to = entry.getBoundingClientRect();
    const dx = from.left - to.left, dy = from.top - to.top, sy = from.height / to.height;
    entry.animate([{ transform: `translate(${dx}px, ${dy}px) scale(1, ${sy})`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: ms(350), easing: E, fill: 'backwards' });
    oldTitle.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: `translate(${-dx}px, ${-dy}px) scale(1, ${1 / sy})`, filter: 'blur(2px)' }], { duration: ms(300), easing: E, fill: 'forwards' });
    await new Promise(r => setTimeout(r, ms(120)));
    newP.style.opacity = '';
    stagger(newP, { from: 12, dur: 400, gap: 100 });
  } else if (dir < 0) {
    // 2b. back: the ledger row re-opens into its question — the same FLIP, reversed
    oldTitle.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(-12px)', filter: 'blur(4px)' }], { duration: ms(150), easing: OUT, fill: 'forwards' });
    newP.style.opacity = '';
    const nt = newP.querySelector('[data-title]');
    if (leavingRect) {
      const to = nt.getBoundingClientRect();
      const dx = leavingRect.left - to.left, dy = leavingRect.top - to.top, sy = leavingRect.height / to.height;
      nt.animate([{ transform: `translate(${dx}px, ${dy}px) scale(1, ${sy})`, opacity: 0.6, filter: 'blur(2px)' }, { transform: 'none', opacity: 1, filter: 'blur(0)' }], { duration: ms(350), easing: E, fill: 'backwards' });
      stagger(newP, { from: 12, dur: 400, gap: 100, skipTitle: true });
    } else {
      await new Promise(r => setTimeout(r, ms(60)));
      stagger(newP, { from: 12, dur: 400, gap: 100 });
    }
  } else {
    // 2c. from the chooser: nothing to file yet, the first question simply rises
    oldTitle.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(-12px)', filter: 'blur(4px)' }], { duration: ms(150), easing: OUT, fill: 'forwards' });
    await new Promise(r => setTimeout(r, ms(90)));
    newP.style.opacity = '';
    stagger(newP, { from: 12, dur: 400, gap: 100 });
  }
  await new Promise(r => setTimeout(r, ms(280)));
}

async function transitionFuoco(oldP, newP) {
  const pages = $('.pages'); pages.append(newP);
  if (reduce()) { oldP.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(150), fill: 'forwards' }); await finished(newP.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(200), fill: 'forwards' })); return; }
  // In place: the old question dissolves (blur bridges the two states), the new one arrives word by word.
  const out = oldP.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'scale(0.98)', filter: 'blur(4px)' }], { duration: ms(150), easing: 'cubic-bezier(0.2, 0, 0, 1)', fill: 'forwards' });
  newP.style.opacity = '0';
  await new Promise(r => setTimeout(r, ms(90)));
  newP.style.opacity = '';
  stagger(newP, { from: 12, dur: 400, gap: 100, wordsToo: true });
  await finished(out);
}

/* Pila: previous sheets stay mounted, pushed back in depth. CSS transitions do the depth so a quick
   back mid-motion retargets instead of restarting. */
function layoutPile(exclude) {
  const ps = [...$('.pages').children].filter(p => p !== exclude);
  ps.forEach((p, k) => {
    const d = ps.length - 1 - k;
    p.style.transform = d ? `translateY(${-7 * d}px) scale(${1 - 0.035 * d})` : '';
    p.style.setProperty('--dim', d ? String(Math.min(0.7, 0.35 + 0.15 * (d - 1))) : '0');
    d ? p.setAttribute('inert', '') : p.removeAttribute('inert');
  });
}
async function transitionPila(oldP, dir) {
  const pagesEl = $('.pages'), E = 'cubic-bezier(0.32, 0.72, 0, 1)';
  if (dir > 0) {
    const cur = buildPage(STEPS[state.i]); pagesEl.append(cur);
    const a = reduce()
      ? cur.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(200), easing: 'ease-out' })
      : cur.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: ms(350), easing: E });
    layoutPile();
    await finished(a);
  } else {
    let prev = oldP.previousElementSibling;
    if (!prev) { // reached via ?step=: the sheet below was never built
      prev = buildPage(STEPS[state.i]); prev.style.transition = 'none'; pagesEl.insertBefore(prev, oldP);
      prev.style.transform = 'translateY(-7px) scale(0.965)'; prev.style.setProperty('--dim', '0.35'); void prev.offsetHeight; prev.style.transition = '';
    }
    oldP.setAttribute('inert', '');
    // exit is the shorter leg: 300ms down, while the sheet below grows back
    const a = reduce()
      ? oldP.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(150), fill: 'forwards' })
      : oldP.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: ms(300), easing: E, fill: 'forwards' });
    layoutPile(oldP);
    await finished(a);
    oldP.remove();
  }
}

async function go(nextIndex) {
  if (busy || nextIndex < 0 || nextIndex >= STEPS.length) return;
  busy = true;
  const dir = nextIndex > state.i ? 1 : -1;
  const pagesEl = $('.pages');
  const oldP = pagesEl.lastElementChild;
  state.i = nextIndex;
  updateProgress();
  const v = document.body.dataset.variant;
  if (v === 'pila') await transitionPila(oldP, dir);
  else {
    const newP = buildPage(STEPS[state.i]);
    oldP.setAttribute('inert', '');
    if (v === 'sfoglia') await transitionSfoglia(oldP, newP, dir);
    else if (v === 'registro') await transitionRegistro(oldP, newP, dir);
    else await transitionFuoco(oldP, newP, dir);
    oldP.remove();
  }
  busy = false;
  const focusable = pagesEl.lastElementChild.querySelector('[data-title]'); if (focusable) { focusable.setAttribute('tabindex', '-1'); focusable.focus({ preventScroll: true }); }
}

/* ---------- mount ---------- */
function mount({ animateFirst = true } = {}) {
  const v = document.body.dataset.variant;
  $('#axis').textContent = AXIS[v];
  const screen = $('#screen');
  screen.innerHTML = `${buildChrome(v)}<div class="pages"></div>`;
  const page = buildPage(STEPS[state.i]);
  if (v === 'pila') {
    // the sheets below are real pages, so a deep link shows the pile as it would be after the steps
    for (let k = 0; k < state.i; k++) $('.pages').append(buildPage(STEPS[k]));
    $('.pages').append(page); layoutPile();
  } else $('.pages').append(page);
  renderLedger(); updateProgress();
  if (animateFirst) stagger(page, { from: 12, dur: 400, gap: 100, wordsToo: v === 'fuoco' });
}

/* ---------- interactions inside the steps ---------- */
$('#screen').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || busy) return;
  const act = b.dataset.act;
  if (act === 'fresh') return go(1);
  if (act === 'next') return go(state.i + 1);
  if (act === 'back') return go(state.i - 1);
  if (act === 'restart') { state.i = 0; return mount(); }
  if (b.dataset.jump) return go(STEPS.indexOf(b.dataset.jump));
  if (b.dataset.period) {
    state.periodKind = b.dataset.period;
    b.closest('[role=radiogroup]').querySelectorAll('[data-period]').forEach(r => { const on = r.dataset.period === state.periodKind; r.setAttribute('aria-checked', on); r.querySelector('.tick').dataset.on = on; });
    const rv = $('.reveal'); const open = state.periodKind === 'cycle'; rv.dataset.open = open; open ? rv.removeAttribute('inert') : rv.setAttribute('inert', '');
    $('[data-preview]').textContent = periodPreview(); return;
  }
  if (b.dataset.day) { state.day = +b.dataset.day; b.parentElement.querySelectorAll('.day').forEach(d => d.setAttribute('aria-pressed', +d.dataset.day === state.day)); $('[data-preview]').textContent = periodPreview(); return; }
  if (b.dataset.type) { state.accountType = b.dataset.type; b.parentElement.querySelectorAll('.tile').forEach(t => t.setAttribute('aria-checked', t.dataset.type === state.accountType)); return; }
  if (b.dataset.cat) { const id = b.dataset.cat; state.cats.has(id) ? state.cats.delete(id) : state.cats.add(id); b.setAttribute('aria-checked', state.cats.has(id)); $('[data-count]').textContent = T.categoriesSelected.replace('{n}', state.cats.size); return; }
  if (b.dataset.key) {
    const k = b.dataset.key;
    if (k === 'del') state.buf = state.buf.slice(0, -1);
    else if (k === ',') { if (!state.buf.includes(',')) state.buf = (state.buf || '0') + ','; }
    else { const [i, d] = state.buf.split(','); if (d !== undefined) { if (d.length < 2) state.buf += k; } else if (i.length < 9 && !(i === '0')) state.buf += k; else if (i === '0') state.buf = k; }
    const a = fmtAmount(); const out = $('[data-amount]');
    const prev = out.querySelectorAll('.g').length;
    out.innerHTML = a.int.split('').map((ch, j) => `<span class="g ${j >= prev && k !== 'del' ? 'in' : ''}">${ch}</span>`).join('') + `<span class="dec">,${a.dec} €</span>`;
    return;
  }
});
$('#screen').addEventListener('input', (e) => { if (e.target.matches('[data-name]')) state.accountName = e.target.value; });

/* ---------- picker ---------- */
function setVariant(v, { push = true } = {}) {
  document.body.dataset.variant = v;
  document.querySelectorAll('.variant-picker [data-variant]').forEach(b => b.setAttribute('aria-current', b.dataset.variant === v));
  if (push) { const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); }
  mount({ animateFirst: false }); // switching is the harness's highest-frequency action: instant
}
document.querySelectorAll('.variant-picker [data-variant]').forEach(b => b.addEventListener('click', () => setVariant(b.dataset.variant)));
$('#restart').addEventListener('click', () => { state.i = 0; mount(); });
$('#theme').addEventListener('click', toggleTheme);
$('#slow').addEventListener('click', toggleSlow);
function toggleTheme() {
  // suppress transitions during the flip, then restore next frame
  const s = document.createElement('style'); s.textContent = '*,*::before,*::after{transition:none !important}'; document.head.append(s);
  document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  void document.body.offsetHeight; requestAnimationFrame(() => requestAnimationFrame(() => s.remove()));
  const u = new URL(location.href); u.searchParams.set('theme', document.body.dataset.theme); history.replaceState(null, '', u);
}
function toggleSlow() { SPEED = SPEED === 1 ? 5 : 1; $('#slow').setAttribute('aria-pressed', SPEED !== 1); document.documentElement.style.setProperty('--press-ms', `${150 * SPEED}ms`); document.documentElement.style.setProperty('--fade-ms', `${200 * SPEED}ms`); document.documentElement.style.setProperty('--progress-ms', `${300 * SPEED}ms`); }
addEventListener('keydown', (e) => {
  if ((e.target instanceof Element && e.target.matches('input, textarea')) || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = VARIANTS.indexOf(document.body.dataset.variant);
  if (e.key === 'ArrowRight') setVariant(VARIANTS[(i + 1) % VARIANTS.length]);
  else if (e.key === 'ArrowLeft') setVariant(VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length]);
  else if (/^[1-4]$/.test(e.key)) setVariant(VARIANTS[+e.key - 1]);
  else if (e.key === 'r' || e.key === 'R') { state.i = 0; mount(); }
  else if (e.key === 't' || e.key === 'T') toggleTheme();
  else if (e.key === 's' || e.key === 'S') toggleSlow();
  else return;
  e.preventDefault();
});

/* ---------- boot from URL ---------- */
{
  const u = new URL(location.href);
  const v = u.searchParams.get('variant'); const th = u.searchParams.get('theme'); const st = u.searchParams.get('step');
  if (th === 'light' || th === 'dark') document.body.dataset.theme = th;
  if (st && STEPS.includes(st)) state.i = STEPS.indexOf(st);
  setVariant(VARIANTS.includes(v) ? v : 'sfoglia', { push: false });
  stagger($('.page'), { from: 12, dur: 400, gap: 100, wordsToo: document.body.dataset.variant === 'fuoco' });
}
</script>
