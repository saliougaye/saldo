<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saldo — marketing site · A · Product (refined)</title>
<!--
  Marketing site landing page for apps/site (ROADMAP 0.8): variant A (Product), chosen 2026-10-18 from
  2026-10-18-marketing-site-variants.html and refined.

  URL: ?theme=dark|light&width=fluid|390[&lang=en]
  Width 390 narrows the page in place (the layout reads container queries, so it reflows like a phone).

  Every phone screen is drawn in HTML/CSS from the @saldo/ui tokens (light and dark), at 390×844 pt and
  scaled. Strings come from packages/i18n/src/locales/en.ts; the sample data is one English September,
  consistent across screens. Both live in LOCALES.en (one object per language): adding Italian means adding
  LOCALES.it with the same shape. docs/screenshots/*.png served as ground truth for layout and numbers only.
  The only external file is the Geist font.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokens (packages/ui/src/tokens.ts) ---------- */
:root{
  --font-family:Geist,"Inter Tight",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-caption:11px;--fs-footnote:13px;--fs-body:15px;--fs-headline:17px;--fs-amount-key:22px;--fs-title:24px;
  --fs-amount-md:28px;--fs-amount-lg:32px;--fs-display:34px;--fs-amount-xl:38px;--fs-hero:44px;--fs-hero-web:56px;
  /* proposed for apps/site, not in tokens.ts yet: the marketing display size */
  --fs-site-display:72px;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;
  --tr-tight:-0.01em;--tr-tighter:-0.02em;--tr-tightest:-0.03em;
  --r-icon:8px;--r-chip:9px;--r-input:10px;--r-toggle:11px;--r-button:12px;--r-card:14px;--r-dialog:16px;--r-fab:18px;--r-pill:999px;
  --content-wide:1120px;--pad-web:48px;--pad-x:16px;--section-gap:56px;--column-gap:72px;
  --hit:44px;--icon-box:32px;--icon-box-lg:44px;--nav-item:36px;--topbar:64px;
  --progress:4px;--progress-thick:8px;--tick:3px;--tick-thick:4px;
  --toggle-w:38px;--toggle-h:22px;--toggle-knob:16px;
  --ease:cubic-bezier(0.32,0.72,0,1);--ease-swap:cubic-bezier(0.2,0,0,1);
  --press:120ms;--fade:200ms;--count:420ms;--enter:400ms;--exit:150ms;--chunk:100ms;--stagger:40ms;--peek:520ms;--toggle:180ms;
  --cat-0:#C57B4E;--cat-1:#B4894A;--cat-2:#8F9152;--cat-4:#4F8D8B;--cat-5:#5A82A6;--cat-6:#7A79AC;--cat-7:#A06FA0;--cat-8:#AF6B7B;--cat-9:#8A8A8A;--cat-14:#4A8560;--cat-23:#6B7785;--cat-12:#C9A048;--cat-16:#5B9BC0;--cat-17:#4F6FB0;--cat-18:#6461A8;
}
[data-theme="dark"]{color-scheme:dark;
  --color-page:#050505;--color-bg:#0A0A0A;--color-surface:#121212;--color-raised:#1A1A1A;
  --color-border:rgba(255,255,255,0.07);--color-border-strong:rgba(255,255,255,0.12);
  --color-text:#EDEDED;--color-text-muted:#8C8C8C;--color-text-faint:#5C5C5C;
  --color-accent:#C7C7C7;--color-positive:#5FBF7F;--color-on-accent:#0A0A0A;--color-bar-grey:#3A3A3A;
  --color-track:#1E1E1E;--color-shadow:rgba(0,0,0,0.5);--color-ghost-ink:#3A3A3A;
  --glass:rgba(10,10,10,0.72);}
[data-theme="light"]{color-scheme:light;
  --color-page:#E9E9E7;--color-bg:#FFFFFF;--color-surface:#FAFAF9;--color-raised:#F1F1EF;
  --color-border:rgba(0,0,0,0.08);--color-border-strong:rgba(0,0,0,0.18);
  --color-text:#171717;--color-text-muted:#6E6E6E;--color-text-faint:#9A9A9A;
  --color-accent:#4A4A46;--color-positive:#2E8A50;--color-on-accent:#FFFFFF;--color-bar-grey:#C9C9C6;
  --color-track:#EDEDEB;--color-shadow:rgba(0,0,0,0.12);--color-ghost-ink:#C9C9C6;
  --glass:rgba(255,255,255,0.72);}
@media (prefers-contrast:more){
  [data-theme]{--color-border:var(--color-border-strong);--color-text-faint:var(--color-text-muted)}
  [data-theme="dark"]{--color-text-muted:#C7C7C7}
  [data-theme="light"]{--color-text-muted:#4A4A46}
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#050505;color:#EDEDED;font-family:var(--font-family);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* ---------- harness chrome (dark palette values only) ---------- */
.hx{background:#0A0A0A;border-bottom:1px solid rgba(255,255,255,0.07);color:#8C8C8C;font-size:13px}
.hx-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px}
.hx-title{color:#EDEDED;font-weight:500;letter-spacing:-0.01em;margin-right:auto}
.hx-title span{color:#5C5C5C;font-weight:400}
.hx-grp{display:flex;align-items:center;gap:8px}
.hx-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5C5C5C}
.seg{display:flex;background:#121212;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:2px}
.seg button{min-height:32px;padding:0 12px;border-radius:8px;color:#8C8C8C;font-size:13px;transition:background-color var(--press) var(--ease-swap),color var(--press) var(--ease-swap)}
.seg button[aria-pressed="true"]{background:#1A1A1A;color:#EDEDED}
.seg button:focus-visible,.brief:focus-visible{outline:2px solid #EDEDED;outline-offset:2px}
.hx-note{padding:0 20px 14px;color:#5C5C5C;font-size:12px;line-height:1.5}
.hx-note code{font-family:var(--font-mono);color:#8C8C8C;font-size:11.5px}
@media (max-width:900px){.briefs{grid-template-columns:minmax(0,1fr)}.hx-title{flex-basis:100%}}

.stage{background:var(--color-page);min-height:100vh}
.stage.narrow{padding:24px 0 48px}
.stage.narrow .site{width:390px;margin-inline:auto;border-radius:var(--r-dialog);box-shadow:0 0 0 1px var(--color-border-strong),0 24px 64px var(--color-shadow);overflow:clip}

/* ---------- site base ---------- */
.site{container-type:inline-size;container-name:site;background:var(--color-bg);color:var(--color-text);font-size:var(--fs-body);line-height:1.5;font-feature-settings:"ss01" 0}
.site :focus-visible{outline:2px solid var(--color-text);outline-offset:2px;border-radius:var(--r-input)}
.wrap{width:100%;max-width:calc(var(--content-wide) + 2*var(--pad-web));margin-inline:auto;padding-inline:var(--pad-web)}
@container site (max-width:760px){.wrap{padding-inline:20px}}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico.gh{stroke:none}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:var(--tr-tighter)}
.amt .dec{opacity:.5}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.press{transition-property:scale,background-color,color,box-shadow,opacity;transition-duration:var(--press);transition-timing-function:var(--ease-swap)}
.press:active{scale:.96}

/* type */
.display{font-size:clamp(var(--fs-hero),7.2cqi,var(--fs-site-display));font-weight:var(--fw-semibold);line-height:1.02;letter-spacing:var(--tr-tightest);text-wrap:balance}
.mega{font-size:clamp(var(--fs-hero),9cqi,var(--fs-site-mega));font-weight:var(--fw-semibold);line-height:.98;letter-spacing:var(--tr-tightest);text-wrap:balance}
.h2{font-size:clamp(var(--fs-amount-md),4.4cqi,var(--fs-hero-web));font-weight:var(--fw-semibold);line-height:1.06;letter-spacing:var(--tr-tightest);text-wrap:balance}
.h3{font-size:var(--fs-headline);font-weight:var(--fw-medium);line-height:1.3;letter-spacing:var(--tr-tight);text-wrap:balance}
.lede{font-size:var(--fs-headline);line-height:1.55;color:var(--color-text-muted);text-wrap:pretty}
.p{color:var(--color-text-muted);text-wrap:pretty;line-height:1.55}
.eyebrow{font-size:var(--fs-footnote);color:var(--color-text-muted);letter-spacing:var(--tr-tight);font-weight:var(--fw-medium);display:flex;align-items:center;gap:8px}
.eyebrow .dot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--color-positive)}
.micro{font-size:var(--fs-footnote);color:var(--color-text-muted);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px}
.micro span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.micro .ico{color:var(--color-positive);font-size:14px}

/* buttons: two CTAs only — the repository and the guide */
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--hit);padding:0 18px;border-radius:var(--r-button);font-size:var(--fs-body);font-weight:var(--fw-medium);letter-spacing:var(--tr-tight);white-space:nowrap}
.btn .ico{font-size:18px}
.btn-primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:0 1px 2px var(--color-shadow)}
.btn-ghost{color:var(--color-text);box-shadow:inset 0 0 0 1px var(--color-border-strong)}
.btn-ghost .ico:last-child{color:var(--color-text-muted);font-size:16px;transition:translate var(--press) var(--ease-swap)}
.btn-text{padding:0 6px;color:var(--color-text-muted)}
.btn-sm{min-height:36px;padding:0 12px;font-size:var(--fs-footnote);gap:8px}
.btn-sm .ico{font-size:16px}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:var(--color-text)}
  .btn-ghost:hover{background:var(--color-raised)}
  .btn-ghost:hover .ico:last-child{translate:2px -2px}
  .btn-text:hover{color:var(--color-text)}
}
.btn:focus-visible{border-radius:var(--r-button)}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:0 1px 0 transparent;transition:box-shadow var(--fade) var(--ease-swap)}
.nav.scrolled{box-shadow:0 1px 0 var(--color-border)}
.nav-in{display:flex;align-items:center;gap:24px;height:var(--topbar)}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:var(--hit);font-size:var(--fs-headline);font-weight:var(--fw-semibold);letter-spacing:var(--tr-tighter)}
.brand .mark{width:28px;height:28px;border-radius:var(--r-icon);background:var(--color-raised);overflow:hidden;flex:none}
.brand .mark img{width:100%;height:100%}
.nav-links{display:flex;gap:4px;margin-inline-start:16px}
.nav-links a{display:inline-flex;align-items:center;min-height:var(--nav-item);padding:0 12px;border-radius:var(--r-input);color:var(--color-text-muted);font-size:var(--fs-footnote);letter-spacing:var(--tr-tight)}
@media (hover:hover) and (pointer:fine){.nav-links a:hover{color:var(--color-text);background:color-mix(in srgb,var(--color-raised) 60%,transparent)}}
.nav-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
@container site (max-width:760px){.nav-links{display:none}.nav-in{gap:12px}.nav-end .hide-narrow{display:none}}
@media (prefers-reduced-transparency:reduce){.nav{background:var(--color-bg);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* sections */
.sec{position:relative;padding-block:clamp(72px,10cqi,128px)}
.sec-head{display:flex;flex-direction:column;gap:16px;max-width:760px;margin-bottom:clamp(32px,5cqi,56px)}
.sec-head.center{margin-inline:auto;text-align:center;align-items:center}

/* reveal on scroll: opacity + translate only, once */
html.js .rv{opacity:0;translate:0 12px;transition:opacity var(--enter) var(--ease-swap),translate var(--enter) var(--ease-swap);transition-delay:calc(var(--i,0) * 60ms)}
html.js .rv.in{opacity:1;translate:none}
/* the hero arrives chunk by chunk, once (motion.stepEnterMs / stepChunkStaggerMs / stepEnterOffset) */
@keyframes rise{from{opacity:0;translate:0 12px}to{opacity:1;translate:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
html.js .enter{animation:rise var(--enter) var(--ease-swap) both;animation-delay:calc(var(--i,0) * var(--chunk))}
@media (prefers-reduced-motion:reduce){
  html.js .rv{translate:none;transition:opacity var(--fade) linear}
  html.js .enter{animation-name:fade;animation-duration:var(--fade)}
  .press:active{scale:1}
  .btn-ghost:hover .ico:last-child{translate:none}
}

/* ---------- app primitives (ListRow, IconBox, ProgressBar, TargetRing) ---------- */
.ibox{position:relative;flex:none;width:var(--icon-box);height:var(--icon-box);border-radius:var(--r-icon);display:grid;place-items:center;color:var(--c,var(--color-text-muted));background:color-mix(in srgb,var(--c,var(--color-text-muted)) 16%,transparent)}
.ibox .ico{font-size:18px}
.ibox .badge{position:absolute;inset-block-end:-3px;inset-inline-end:-3px;width:15px;height:15px;border-radius:var(--r-pill);background:var(--color-bg);color:var(--color-text-muted);display:grid;place-items:center}
.ibox .badge .ico{font-size:10px}
.track{position:relative;overflow-x:clip;height:var(--progress);border-radius:var(--r-pill);background:var(--color-track)}
.track.thick{height:var(--progress-thick)}
.track .fill{position:absolute;inset:0;border-radius:var(--r-pill);background:var(--color-bar-grey);transform-origin:left center;transform:scaleX(var(--p,0));transition:transform var(--count) var(--ease),background-color var(--fade) var(--ease-swap)}
.track .fill.over{background:var(--color-accent)}
.track .tick{position:absolute;inset-block:calc(-1 * var(--tick));left:0;width:100%;transform:translateX(calc(var(--t,0) * (100% - 1px)));transition:transform var(--count) var(--ease);pointer-events:none}
.track.thick .tick{inset-block:calc(-1 * var(--tick-thick))}
.track .tick::before{content:"";position:absolute;inset-block:0;left:0;width:1px;background:var(--color-text-muted)}
.row{display:flex;align-items:center;gap:12px;min-height:var(--hit);padding:8px 0}
.row .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.row .t{font-size:var(--fs-body);letter-spacing:var(--tr-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:var(--fs-footnote);color:var(--color-text-faint)}
.row .amt{font-size:var(--fs-body)}
.row .amt.muted{color:var(--color-text-muted)}
.label{font-size:var(--fs-footnote);color:var(--color-text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--r-pill);background:var(--color-raised);color:var(--color-text-muted);font-size:var(--fs-caption);font-weight:var(--fw-medium);letter-spacing:0;white-space:nowrap}
.chip.attn{color:var(--color-text)}
.chip .ico{font-size:12px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card{background:var(--color-surface);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px var(--color-border)}
.mock{display:flex;flex-direction:column;gap:4px}

/* budget row (BudgetRow on the phone) */
.brow{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.brow-top{display:flex;align-items:center;gap:12px}
.brow-name{flex:1;min-width:0;display:flex;flex-direction:column}
.brow-name .t{font-size:var(--fs-body);letter-spacing:var(--tr-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow-name .s,.brow-amt .s{font-size:var(--fs-footnote);color:var(--color-text-faint);font-variant-numeric:tabular-nums}
.brow-amt{display:flex;flex-direction:column;align-items:flex-end}
.brow-amt .t{font-size:var(--fs-body);font-weight:var(--fw-medium)}
.brow-amt .s .amt{letter-spacing:0}

/* sheet-like option list (recurrence scope, periods) */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:12px;min-height:var(--hit);padding:10px 12px;border-radius:var(--r-input);background:var(--color-raised)}
.opt .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.opt .t{font-size:var(--fs-footnote);font-weight:var(--fw-medium);color:var(--color-text)}
.opt .s{font-size:var(--fs-caption);color:var(--color-text-muted);line-height:1.4}
.opt .radio{width:16px;height:16px;border-radius:var(--r-pill);box-shadow:inset 0 0 0 1.5px var(--color-border-strong);flex:none}
.opt.on{box-shadow:inset 0 0 0 1px var(--color-border-strong);background:var(--color-surface)}
.opt.on .radio{box-shadow:inset 0 0 0 5px var(--color-text)}

/* terminal */
.term{border-radius:var(--r-card);background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-border);overflow:hidden;font-family:var(--font-mono);font-size:var(--fs-footnote);line-height:1.75}
.term-bar{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 14px;border-bottom:1px solid var(--color-border);color:var(--color-text-faint);font-family:var(--font-family);font-size:var(--fs-caption)}
.term-bar .dots{display:flex;gap:6px}.term-bar .dots i{width:9px;height:9px;border-radius:var(--r-pill);background:var(--color-raised);box-shadow:inset 0 0 0 1px var(--color-border-strong)}
.term-bar .path{flex:1;text-align:center;font-family:var(--font-mono)}
.term pre{margin:0;padding:16px 18px;overflow-x:auto;color:var(--color-text);white-space:pre;scrollbar-width:thin}
.term .c{color:var(--color-text-faint)}
.term .pr{color:var(--color-text-faint);user-select:none}
.term .ok{color:var(--color-positive)}
.copy{position:relative;display:inline-grid;place-items:center;width:var(--hit);height:32px;border-radius:var(--r-chip);color:var(--color-text-muted)}
.copy .ico{grid-area:1/1;font-size:15px;transition:opacity var(--fade) var(--ease-swap),scale var(--fade) var(--ease-swap),filter var(--fade) var(--ease-swap)}
.copy .ico.b{opacity:0;scale:.25;filter:blur(4px);color:var(--color-positive)}
.copy.done .ico.a{opacity:0;scale:.25;filter:blur(4px)}
.copy.done .ico.b{opacity:1;scale:1;filter:blur(0)}
@media (hover:hover) and (pointer:fine){.copy:hover{color:var(--color-text);background:var(--color-raised)}}

/* FAQ */
.faq{display:flex;flex-direction:column}
.faq details{border-top:1px solid var(--color-border)}
.faq details:last-child{border-bottom:1px solid var(--color-border)}
.faq summary{display:flex;align-items:center;gap:16px;min-height:var(--hit);padding:16px 0;cursor:pointer;list-style:none;font-size:var(--fs-headline);font-weight:var(--fw-medium);letter-spacing:var(--tr-tight);text-wrap:balance}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{margin-inline-start:auto;color:var(--color-text-muted);font-size:18px;transition:rotate var(--fade) var(--ease-swap)}
.faq details[open] summary .ico{rotate:180deg}
.faq .ans{padding:0 40px 20px 0;color:var(--color-text-muted);max-width:640px;text-wrap:pretty}
.faq summary:focus-visible{outline-offset:-2px}

/* footer */
.foot{border-top:1px solid var(--color-border);padding-block:28px}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;font-size:var(--fs-footnote);color:var(--color-text-faint)}
.foot-in .brand{font-size:var(--fs-body);color:var(--color-text-muted)}
.foot-in .brand .mark{width:24px;height:24px}
.foot-links{display:flex;flex-wrap:wrap;gap:0 4px;margin-inline-start:auto}
.foot-links a{display:inline-flex;align-items:center;min-height:var(--hit);padding:0 10px;color:var(--color-text-muted);border-radius:var(--r-input)}
@media (hover:hover) and (pointer:fine){.foot-links a:hover{color:var(--color-text)}}
@container site (max-width:760px){.foot-links{margin-inline-start:-10px;width:100%}}

/* =====================================================================
   A · PRODUCT
   ===================================================================== */
.a-hero{position:relative;overflow:clip;padding-top:clamp(56px,8cqi,104px)}
.a-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);background-size:64px 64px;background-position:center -1px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 22%,#000 20%,transparent 72%);mask-image:radial-gradient(ellipse 60% 55% at 50% 22%,#000 20%,transparent 72%)}
.a-hero-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.a-hero-in .display{max-width:13ch}
.a-hero-in .lede{max-width:560px;text-wrap:balance}
.a-hero-in .ctas{justify-content:center;margin-top:8px}

.cgrid span.ot i{background:transparent;box-shadow:none;border:1.5px dashed var(--color-border-strong)}
.pbtn2{display:grid;place-items:center;height:52px;border-radius:var(--r-button);background:var(--color-accent);color:var(--color-on-accent);font-size:var(--fs-headline);font-weight:var(--fw-medium)}
.sheet{flex:1;min-height:0;margin-top:8px;border-radius:var(--r-dialog) var(--r-dialog) 0 0;background:var(--color-bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -1px 0 var(--color-border)}
.grab{width:36px;height:4px;border-radius:var(--r-pill);background:var(--color-border-strong);margin:8px auto 0;flex:none}
.split{display:flex;height:var(--progress-thick);border-radius:var(--r-pill);overflow:hidden;gap:2px}
.split i{height:100%}
.mchart{display:block;width:100%;height:auto;overflow:visible}
.leg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--fs-caption);color:var(--color-text-muted)}
.leg2 span{display:inline-flex;align-items:center;gap:5px}
.leg2 i{width:9px;height:9px;border-radius:2px}
.cheer{position:absolute;right:18px;top:-48px;width:76px;height:48px;overflow:hidden}
.cheer img{width:76px;height:auto}

/* =====================================================================
   Carousel: native scroll + snap, mouse drag with momentum, buttons, keys
   ===================================================================== */
.car{position:relative;--edge:max(var(--pad-web),calc((100cqi - var(--content-wide)) / 2))}
.car-sc{position:relative;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:var(--edge);overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab;outline:none}
.car-sc::-webkit-scrollbar{display:none}
.car-sc.drag{cursor:grabbing;scroll-snap-type:none}
.car-sc.anim{scroll-snap-type:none}
.car-sc:focus-visible{box-shadow:inset 0 0 0 2px var(--color-text);border-radius:var(--r-dialog)}
.car-tr{display:flex;gap:24px;width:max-content;padding:12px var(--edge) 28px;will-change:transform}
.car-it{flex:none;display:flex;flex-direction:column;gap:14px;scroll-snap-align:start;--cw:264}
.car-it figcaption{width:calc(var(--cw) * 1px);display:flex;flex-direction:column;gap:2px;font-size:var(--fs-footnote);line-height:1.45;color:var(--color-text-muted);text-wrap:pretty}
.car-it figcaption b{color:var(--color-text);font-weight:var(--fw-medium)}
.car-it img{-webkit-user-drag:none}
.car::before,.car::after{content:"";position:absolute;z-index:2;top:0;bottom:0;width:min(var(--edge),96px);pointer-events:none;opacity:0;transition:opacity var(--fade) var(--ease-swap)}
.car::before{left:0;background:linear-gradient(to right,var(--color-bg),transparent)}
.car::after{right:0;background:linear-gradient(to left,var(--color-bg),transparent)}
.car.fl::before,.car.fr::after{opacity:1}
.car-ctl{display:flex;align-items:center;gap:16px;margin-top:4px}
.car-prog{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.car-count{font-size:var(--fs-footnote);color:var(--color-text-muted);font-variant-numeric:tabular-nums;min-width:5ch}
.car-count b{color:var(--color-text);font-weight:var(--fw-medium)}
.car-bar{position:relative;flex:0 1 200px;height:2px;border-radius:var(--r-pill);background:var(--color-track);overflow:hidden}
.car-bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:var(--r-pill);background:var(--color-text);transform-origin:left center}
.car-name{font-size:var(--fs-footnote);color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-btns{display:flex;gap:8px}
@container site (max-width:760px){.car{--edge:20px}.car-tr{gap:16px}.car-it{--cw:232}.car-name{display:none}}
@media (prefers-reduced-motion:reduce){.car::before,.car::after{transition:none}}

/* web app + MCP row */
.wrow{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;margin-top:clamp(56px,7cqi,88px);align-items:start}
.wrow figure{display:flex;flex-direction:column;gap:14px;min-width:0}
.wrow figcaption{font-size:var(--fs-footnote);line-height:1.45;color:var(--color-text-muted);display:flex;flex-direction:column;gap:2px}
.wrow figcaption b{color:var(--color-text);font-weight:var(--fw-medium)}
.wrow .win{height:420px;margin:0;-webkit-mask-image:none;mask-image:none}
.wrow .win-side{display:none}
.wt-row .tx,.wt-row .tx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-chips span{white-space:nowrap}
.wt-chips{overflow:hidden}
.wt-main > *{flex-shrink:0}
.wt-main{flex:1;min-width:0;padding:22px 24px;display:flex;flex-direction:column;gap:12px;text-align:left}
.wt-head{display:flex;align-items:center;gap:12px}
.wt-head b{flex:1;font-size:var(--fs-title);font-weight:var(--fw-semibold);letter-spacing:var(--tr-tighter)}
.wt-search{display:flex;align-items:center;gap:8px;height:34px;width:200px;padding:0 10px;border-radius:var(--r-input);background:var(--color-raised);box-shadow:inset 0 0 0 1px var(--color-border);font-size:var(--fs-footnote);color:var(--color-text-faint)}
.wt-search .ico{font-size:14px}
.wt-chips{display:flex;gap:6px}
.wt-chips span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-chip);background:var(--color-raised);font-size:var(--fs-caption);color:var(--color-text-muted)}
.wt-chips .ico{font-size:12px}
.wt-day{display:flex;justify-content:space-between;font-size:var(--fs-footnote);color:var(--color-text-faint);padding-top:6px;border-bottom:1px solid var(--color-border);padding-bottom:6px;font-variant-numeric:tabular-nums}
.wt-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 8px;margin:0 -8px;border-radius:var(--r-input);font-size:var(--fs-footnote)}
.wt-row.sel{background:var(--color-raised)}
.wt-row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.wt-row .tx span{color:var(--color-text-faint);font-size:var(--fs-caption)}
.wt-panel{flex:none;width:240px;border-left:1px solid var(--color-border);background:var(--color-surface);padding:22px 20px;display:flex;flex-direction:column;gap:14px;text-align:left}
.wt-panel .md{font-size:var(--fs-amount-md)}
.wt-facts{display:flex;flex-direction:column}
.wt-facts div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--color-border);font-size:var(--fs-footnote)}
.wt-facts dt{color:var(--color-text-muted)}
.wrow .wmcp{display:flex;flex-direction:column;gap:12px}
.wrow .consent{box-shadow:inset 0 0 0 1px var(--color-border-strong)}
@container site (max-width:1100px){.wt-panel{display:none}}
@container site (max-width:900px){.wrow{grid-template-columns:minmax(0,1fr)}.wrow .win{display:flex;height:380px}}
@container site (max-width:1300px){.wt-search{display:none}}
@container site (max-width:560px){.wt-chips span:nth-child(3){display:none}}

</style>

/* =====================================================================
   PHONE SCREENS. Each one is the app's layout (apps/mobile, docs/screenshots as ground truth)
   drawn with the tokens, at 390×844 pt, and reads only L.s (strings) and L.d (data).
   ===================================================================== */
const sep = () => (0.5).toLocaleString(L.numberLocale).charAt(1);
function fmtNum(c) { return (Math.abs(c) / 100).toLocaleString(L.numberLocale, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
/** Money at the edge: integer cents in, the locale's format out. */
function money(c, { sign = false, dim = true, cls = 'amt', whole = false } = {}) {
  const s = whole ? Math.round(Math.abs(c) / 100).toLocaleString(L.numberLocale) : fmtNum(c);
  const k = s.lastIndexOf(sep());
  const int = whole ? s : s.slice(0, k), dec = whole ? '' : s.slice(k + 1);
  const pre = c < 0 ? '−' : sign && c > 0 ? '+' : '';
  const cur = L.currency, decs = whole ? '' : dim ? `<span class="dec">${sep()}${dec}</span>` : `${sep()}${dec}`;
  return `<span class="${cls}">${pre}${cur.before ? cur.symbol : ''}${int}${decs}${cur.before ? '' : ` ${cur.symbol}`}</span>`;
}
const mt = (c, sign = false, whole = false) => money(c, { sign, dim: false, whole }).replace(/<[^>]+>/g, '');
const ma = (c, o = {}) => money(c, { ...o, cls: `ma${o.extra ? ` ${o.extra}` : ''}${c > 0 && o.sign ? ' pos' : ''}` });

const cat = (k) => L.d.cats[k];
const mib = (k, { sm = false, badge = false, icon: ic, c } = {}) => {
  const x = k ? cat(k) : { icon: ic, c };
  return `<span class="mib${sm ? ' sm' : ''}" style="--c:${x.c}">${icon(x.icon)}${badge ? `<span class="bdg">${icon('repeat')}</span>` : ''}</span>`;
};
const mbar = (ratio, pace, { over = false, thick = false, done = false } = {}) =>
  `<div class="mbar${thick ? ' th' : ''}"><i class="${done ? 'd' : over ? 'o' : ''}" style="width:${Math.min(100, ratio * 100).toFixed(1)}%"></i>${pace == null ? '' : `<b style="left:${(pace * 100).toFixed(1)}%"></b>`}</div>`;
const mrow = (title, sub, trailing, lead, { up = false, chev = false, div = false } = {}) =>
  `<div class="mrow${up ? ' up' : ''}${div ? ' div' : ''}">${lead}<div class="tx"><span class="tt">${title}</span>${sub ? `<span class="st">${sub}</span>` : ''}</div>${trailing}${chev ? icon('chevR', 'ch') : ''}</div>`;
const pace = () => L.d.period.day / L.d.period.len;

const statusBar = () => `<div class="sb"><span class="sb-t">9:41</span><span class="sb-i"></span><span class="sb-r"><span class="sig"><i></i><i></i><i></i><i></i></span>${icon('wifi')}<i class="bat"></i></span></div>`;
function tabbar(active) {
  const t = L.s.tabs, tab = (k, ic) => `<span class="${active === k ? 'on' : ''}">${icon(ic)}${t[k]}</span>`;
  return `<div class="tb">${tab('home', 'house')}${tab('transactions', 'list')}<span></span>${tab('stats', 'trend')}${tab('accounts', 'wallet')}<span class="fab">${icon('plus')}</span></div>`;
}
const periodHead = (avatar) => `<div class="phd">${avatar ? `<span class="av">${L.d.initials}</span>` : ''}<div class="pt"><b>${L.d.period.title}${icon('chevUD')}</b><span>${L.s.period.dayOf(L.d.period.day, L.d.period.len)}</span></div><span class="rb">${icon('chevL')}</span><span class="rb">${icon('chevR')}</span></div>`;
const titleHead = (text, { back = false, plus = false } = {}) => `<div class="ttl">${back ? `<span class="rb">${icon('chevL')}</span>` : ''}<h4>${text}</h4>${plus ? `<span class="sq">${icon('plus')}</span>` : ''}</div>`;
function phone(content, { tab = null, behind = false, label = '', cls = '' } = {}) {
  return `<div class="ph ${cls}" role="img" aria-label="${label}"><div class="ph-s${behind ? ' behind' : ''}" aria-hidden="true">${statusBar()}${content}${tab ? tabbar(tab) : ''}</div></div>`;
}

/* ---------- Statistics ---------- */
function cashflowSvg(cols, { W = 326, half = 64, labels = true } = {}) {
  const n = cols.length, gap = 10, cw = (W - gap * (n - 1)) / n, bw = Math.min(30, cw * 0.62), top = 20, mid = top + half;
  const max = Math.max(...cols.map((c) => Math.max(c.inc, c.f ? c.f[1] : c.exp)));
  const k = (v) => (v / max) * half;
  let g = `<defs><pattern id="hx-a" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--color-accent)"/></pattern><pattern id="hx-p" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--color-positive)"/></pattern></defs>`;
  g += `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--color-border-strong)"/>`;
  cols.forEach((c, i) => {
    const x = i * (cw + gap) + (cw - bw) / 2, net = Math.round((c.inc - c.exp) / 100), hatch = c.cur || c.f, op = c.f ? 0.45 : 1;
    g += `<rect x="${x}" y="${mid - k(c.inc)}" width="${bw}" height="${k(c.inc)}" rx="4" fill="${hatch ? 'url(#hx-p)' : 'var(--color-positive)'}" ${hatch ? 'stroke="var(--color-positive)"' : ''} opacity="${op}"/>`;
    g += `<rect x="${x}" y="${mid + 1}" width="${bw}" height="${k(c.exp)}" rx="4" fill="${hatch ? 'url(#hx-a)' : 'var(--color-accent)'}" ${hatch ? 'stroke="var(--color-accent)"' : ''} opacity="${op}"/>`;
    if (c.f) g += `<rect x="${x - 3}" y="${mid + k(c.f[0])}" width="${bw + 6}" height="${k(c.f[1]) - k(c.f[0])}" rx="3" fill="var(--color-track)" fill-opacity=".55" stroke="var(--color-text-muted)" stroke-dasharray="2 2"/>`;
    if (labels) g += `<text x="${x + bw / 2}" y="11" text-anchor="middle" font-size="11" fill="var(--color-text-muted)" font-family="Geist, sans-serif">${net > 0 ? '+' : net < 0 ? '−' : ''}${Math.abs(net).toLocaleString(L.numberLocale)}</text>`;
    g += `<text x="${x + bw / 2}" y="${mid + half + 22}" text-anchor="middle" font-size="11" fill="${c.cur ? 'var(--color-text)' : 'var(--color-text-faint)'}" font-family="Geist, sans-serif">${c.m}</text>`;
  });
  return `<svg class="mchart" viewBox="0 0 ${W} ${mid + half + 28}" aria-hidden="true">${g}</svg>`;
}
function scrStats() {
  const s = L.s.stats, d = L.d, total = d.split.rows.reduce((a, r) => a + r[1], 0);
  const leg = (bg, t) => `<span><i style="background:${bg}"></i>${t}</span>`;
  return `<div class="pc">${periodHead(false)}
    <div class="mc"><div class="mh"><span class="t" style="font-size:var(--fs-body)">${s.cashflow}</span><span class="mf">${s.lastAndForecast}</span></div>
      <div style="margin-top:14px">${cashflowSvg(d.cashflow.cols)}</div>
      <div class="mh" style="margin:8px 0 10px;align-items:center"><span class="ml">${s.forecastEndLabel(d.cashflow.endDate)} <b style="font-weight:500;color:var(--color-text)">${mt(d.cashflow.endBalance)}</b></span>${icon('chevR', 'ch')}</div>
      <div class="leg2">${leg('var(--color-positive)', s.legendIncome)}${leg('var(--color-accent)', s.legendExpenses)}${leg('repeating-linear-gradient(135deg,var(--color-text-muted) 0 1.5px,transparent 1.5px 3.5px)', s.legendCurrent)}${leg('repeating-linear-gradient(135deg,var(--color-text-faint) 0 1.5px,transparent 1.5px 3.5px);opacity:.7', s.legendForecast)}${leg('var(--color-track);box-shadow:inset 0 0 0 1px var(--color-text-muted)', s.legendRange)}</div></div>
    <div class="mc"><div class="seg2"><span class="on">${s.expenses}</span><span>${s.income}</span></div>
      <div class="lg" style="margin:14px 0 10px">${ma(total)}</div>
      <div class="split">${d.split.rows.map(([k, v]) => `<i style="flex:${v};background:${cat(k).c}"></i>`).join('')}</div>
      <div style="margin-top:6px">${d.split.rows.slice(0, 3).map(([k, v, dl]) => mrow(cat(k).name, `${dl} · ${s.ofTotal(Math.round((v / total) * 100))}`, ma(v), mib(k))).join('')}</div>
      <div class="mh" style="padding:10px 0 2px;align-items:center"><span>${s.seeAll(d.split.rows.length)}</span>${icon('chevR', 'ch')}</div>
      <div class="mf" style="margin-top:8px">${s.excludedRow(d.excluded.count, mt(d.excluded.amount))}</div></div>
  </div>`;
}

/* ---------- Goals ---------- */
function scrGoals() {
  const s = L.s.goals, t = L.s.targets;
  const card = (g) => {
    const ratio = g.saved / g.target, reached = !!g.reached;
    const meta = reached ? s.reachedOnMeta(g.reached) : g.meta;
    const sentence = reached ? `${s.reached(mt(g.saved))} <span style="color:var(--color-text-muted)">${s.reachedState}</span>`
      : `${s.perMonth(mt(g.per))} <span style="color:var(--color-text-muted)">${g.gap < 0 ? s.behind(mt(-g.gap)) : s.ahead(mt(g.gap))}</span>`;
    const ends = reached ? '' : `<div style="position:relative;height:16px;margin-top:6px" class="mf"><span style="position:absolute;left:0">${g.start}</span><span style="position:absolute;left:${g.pace * 100}%;width:64px;margin-left:-32px;text-align:center;color:var(--color-text-muted)">${t.today}</span><span style="position:absolute;right:0">${g.end}</span></div>`;
    return `<div style="position:relative${reached ? ';margin-top:48px' : ''}">${reached ? `<span class="cheer"><img src="${IMG.rocky}" alt=""></span>` : ''}<div class="mc" style="position:relative">
      <div style="display:flex;align-items:center;gap:10px">${mib(null, { icon: g.icon, c: g.c })}<span style="flex:1">${g.n}</span><span class="ml">${meta}</span></div>
      <div class="lg" style="margin-top:12px">${ma(g.saved)}</div><div class="ml">${t.ofLimit(mt(g.target), `${Math.round(ratio * 100)}%`)}</div>
      <div style="margin-top:14px">${mbar(ratio, reached ? null : g.pace, { thick: true, over: !reached && ratio < g.pace, done: reached })}</div>${ends}
      <p style="margin-top:12px;line-height:1.4;font-size:var(--fs-body)">${sentence.replace(/<b>/g, '<b style="font-weight:500">')}</p></div></div>`;
  };
  return `<div class="pc">${titleHead(s.title, { back: true, plus: true })}${L.d.goals.map(card).join('')}</div>`;
}

function initCarousel(root) {

  const prev = root.querySelector('#carPrev'), next = root.querySelector('#carNext');
  const count = root.querySelector('#carCount'), thumb = root.querySelector('#carThumb'), name = root.querySelector('#carName');
  const names = L.site.shots.map((s) => s[1]), N = items.length, pad2 = (i) => String(i).padStart(2, '0');
  let raf = 0, anim = 0, drag = null, suppress = false;

}

/* ---------- shared behaviour ---------- */
function bindCopy(root) {
  root.querySelectorAll('.copy').forEach((b) => b.addEventListener('click', async () => {
    const txt = b.dataset.copy.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&quot;/g, '"');
    try { await navigator.clipboard.writeText(txt); } catch { /* file:// or no permission: still show the state */ }
    b.classList.add('done'); b.setAttribute('aria-label', 'Copied');
    setTimeout(() => { b.classList.remove('done'); b.setAttribute('aria-label', 'Copy'); }, 1600);
  }));
}
let io = null;
function bindReveal(root) {
  io?.disconnect();

  if (!('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('in')); return; }
  io = new IntersectionObserver((entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.1 });
  els.forEach((e) => io.observe(e));
}
function bindNav(root) {
  const nav = root.querySelector('#nav'); if (!nav) return;
  const on = () => nav.classList.toggle('scrolled', window.scrollY > (nav.offsetTop || 0) + 4);
  window.removeEventListener('scroll', window.__navScroll || (() => {}));
  window.__navScroll = on; window.addEventListener('scroll', on, { passive: true }); on();
  root.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener('click', (e) => {
    const id = a.getAttribute('href').slice(1); const el = id === 'top' ? root : root.querySelector(`#${id}`); if (!el) return;
    e.preventDefault(); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - (id === 'top' ? 0 : 72), behavior: reduced() ? 'auto' : 'smooth' });
  }));
}

/* ---------- harness: theme and width only ---------- */
const site = document.getElementById('site'), stage = document.getElementById('stage');
let theme = params.get('theme') === 'light' || params.get('theme') === 'dark' ? params.get('theme') : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let width = params.get('width') === '390' ? '390' : 'fluid';
function seg(el, items, current, onPick) {
  el.innerHTML = items.map((i) => `<button type="button" aria-pressed="${i.id === current}" data-id="${i.id}">${i.label}</button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => onPick(b.dataset.id)));

  seg(document.getElementById('segW'), [{ id: 'fluid', label: 'Fluid' }, { id: '390', label: '390' }], width, (id) => { width = id; sync(true); });

function render(rerender) {
  noTransitions(() => { stage.dataset.theme = theme; stage.classList.toggle('narrow', width === '390'); });
  chrome();
  if (!rerender) return;
  site.innerHTML = renderPage();

render(true);
