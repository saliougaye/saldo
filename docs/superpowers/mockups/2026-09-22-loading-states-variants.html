<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saldo — Home in caricamento · 4 varianti</title>
<style>
  /* ---------- Saldo tokens (packages/ui/src/tokens.ts) ---------- */
  :root, [data-theme="dark"] {
    --page:#050505; --bg:#0A0A0A; --surface:#121212; --raised:#1A1A1A;
    --border:rgba(255,255,255,0.07); --text:#EDEDED; --text-muted:#8C8C8C; --text-faint:#5C5C5C;
    --accent:#C7C7C7; --positive:#5FBF7F; --on-accent:#0A0A0A; --bar-grey:#3A3A3A; --track:#1E1E1E;
  }
  [data-theme="light"] {
    --page:#E9E9E7; --bg:#FFFFFF; --surface:#FAFAF9; --raised:#F1F1EF;
    --border:rgba(0,0,0,0.08); --text:#171717; --text-muted:#6E6E6E; --text-faint:#9A9A9A;
    --accent:#4A4A46; --positive:#2E8A50; --on-accent:#FFFFFF; --bar-grey:#C9C9C6; --track:#EDEDEB;
  }
  :root {
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --r-card:14px; --r-input:10px; --r-chip:9px; --r-icon:8px;
    --pad:16px; --gap:10px;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:28px 16px 110px; background:#2a2a2a;
    font-family: Geist, "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .caption { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:rgb(255 255 255 / .7); max-width:390px; text-align:center; text-wrap:pretty; }
  .caption b { color:#fff; font-weight:600; }

  /* ---------- Phone ---------- */
  .phone {
    width:390px; height:844px; border-radius:54px; overflow:hidden; position:relative;
    background:var(--bg); color:var(--text);
    box-shadow: 0 0 0 10px #000, 0 0 0 11px #333, 0 30px 80px rgb(0 0 0 / .5);
    display:flex; flex-direction:column;
  }
  .status { height:54px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 32px 0 40px; font-size:16px; font-weight:600; }
  .island { position:absolute; top:11px; left:50%; translate:-50% 0; width:124px; height:36px; border-radius:20px; background:#000; }
  .scroll { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-bottom:120px; }
  .scroll::-webkit-scrollbar { display:none; }

  .header { display:flex; align-items:center; gap:8px; padding:10px 16px 14px; }
  .avatar { width:34px; height:34px; border-radius:17px; background:var(--raised); border:1px solid var(--border); display:grid; place-items:center; font-size:12px; font-weight:500; color:var(--text-muted); flex:0 0 auto; }
  .period { flex:1; min-width:0; margin-inline-start:4px; }
  .period-title { font-size:17px; font-weight:600; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .period-sub { font-size:11px; color:var(--text-faint); margin-top:2px; }
  .nav { display:flex; gap:8px; }
  .nav span { width:34px; height:34px; border-radius:17px; background:var(--raised); display:grid; place-items:center; color:var(--text-muted); }

  .content { padding:0 16px; display:flex; flex-direction:column; gap:var(--gap); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--pad); }
  .card.flush { padding:0; }
  .muted { color:var(--text-muted); } .faint { color:var(--text-faint); }
  .foot { font-size:13px; }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .card-head { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:500; letter-spacing:-0.01em; }
  .card-head .t { flex:1; }
  .card-head .s { font-size:13px; font-weight:400; color:var(--text-muted); }
  .chev { color:var(--text-faint); width:14px; height:14px; }

  .hero { font-size:44px; font-weight:600; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; line-height:52px; margin-top:2px; }
  .hero .dec { opacity:.5; }
  .bar { position:relative; height:4px; border-radius:2px; background:var(--track); margin-top:14px; }
  .bar i { position:absolute; inset:0 auto 0 0; border-radius:2px; background:var(--accent); }
  .bar .pace { position:absolute; top:-3px; bottom:-3px; width:1px; background:var(--text-muted); }

  .list { padding:0 var(--pad) 8px; }
  .li { display:flex; align-items:center; gap:12px; min-height:44px; padding:8px 0; }
  .ib { width:32px; height:32px; border-radius:var(--r-icon); display:grid; place-items:center; flex:0 0 auto; }
  .ib svg { width:16px; height:16px; }
  .li .txt { flex:1; min-width:0; }
  .li .ttl { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li .sub { font-size:13px; color:var(--text-muted); margin-top:2px; }
  .amt { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .amt .dec { opacity:.5; }
  .pos { color:var(--positive); }

  .budget { margin-top:12px; display:flex; flex-direction:column; gap:12px; }
  .budget .b-top { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .budget .b-bar { height:4px; border-radius:2px; background:var(--track); position:relative; }
  .budget .b-bar i { position:absolute; inset:0 auto 0 0; border-radius:2px; background:var(--bar-grey); }
  .budget .b-bar i.over { background:var(--accent); }

  /* ---------- Tab bar ---------- */
  .tabbar { position:absolute; left:0; right:0; bottom:0; height:92px; background:var(--bg); border-top:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr 72px 1fr 1fr; padding:10px 6px 0; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--text-faint); }
  .tab.on { color:var(--text); }
  .tab svg { width:22px; height:22px; }
  .fab { width:56px; height:56px; border-radius:18px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; margin:-26px auto 0; box-shadow:0 8px 20px rgb(0 0 0 / .35); }
  .home-ind { position:absolute; bottom:8px; left:50%; translate:-50% 0; width:134px; height:5px; border-radius:3px; background:var(--text); opacity:.3; }

  /* ---------- Loading primitives (Skeleton.tsx) ---------- */
  @keyframes pulse { from { opacity:.45 } to { opacity:.9 } }
  .sk { display:block; background:var(--track); border-radius:var(--r-chip); height:12px; animation:pulse 600ms var(--ease) infinite alternate; }
  .pulse { animation:pulse 600ms var(--ease) infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .sk, .pulse { animation:none; opacity:.7; } }

  @keyframes spin { to { rotate:360deg } }
  .spinner { width:20px; height:20px; border-radius:50%; border:2px solid var(--track); border-top-color:var(--text-muted); animation:spin 800ms linear infinite; }

  /* Entrance once the data lands: FadeInDown, fadeMs 200, staggerMs 40 (theme/motion.ts). */
  @keyframes enter { from { opacity:0; translate:0 -12px } }
  .enter > * { animation:enter 200ms var(--ease) both; }
  .enter > *:nth-child(2) { animation-delay:40ms } .enter > *:nth-child(3) { animation-delay:80ms } .enter > *:nth-child(4) { animation-delay:120ms }
  @keyframes leave { to { opacity:0 } }
  .leaving { animation:leave 120ms var(--ease) both; }

  /* ---------- Variant picker: deliberately outside the design system ---------- */
  .variant-picker { position:fixed; bottom:24px; left:50%; translate:-50% 0; z-index:2147483647; display:flex; gap:2px; padding:4px; border-radius:999px; background:rgb(20 20 20 / .9); box-shadow:inset 0 0 0 1px rgb(255 255 255 / .1), 0 8px 24px rgb(0 0 0 / .25); font:13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select:none; }
  .variant-picker button { white-space:nowrap; padding:7px 12px; border:0; border-radius:999px; background:none; color:rgb(255 255 255 / .6); cursor:pointer; font:inherit; }
  .variant-picker button:hover { color:rgb(255 255 255 / .85); }
  .variant-picker button[aria-current="true"], .variant-picker button[aria-pressed="true"] { background:rgb(255 255 255 / .14); color:#fff; }
  .variant-picker button:focus-visible { outline:2px solid rgb(255 255 255 / .7); outline-offset:2px; }
  .variant-picker .sep { width:1px; margin:4px 4px; background:rgb(255 255 255 / .15); }
</style>
</head>
<body>

<p class="caption" id="caption"></p>

<div class="phone" id="phone" data-theme="dark">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span style="font-size:13px">●●● ▮</span></div>
  <div class="scroll">
    <div class="header">
      <div class="avatar">SG</div>
      <div class="period">
        <div class="period-title">27 ago – 26 set</div>
        <div class="period-sub">giorno 27 di 31</div>
      </div>
      <div class="nav">
        <span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
        <span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </div>
    </div>
    <div class="content" id="content" aria-live="polite"></div>
  </div>

  <nav class="tabbar" aria-hidden="true">
    <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10l8-6 8 6v10H4z"/><path d="M10 20v-6h4v6"/></svg>Home</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Transazioni</div>
    <div><div class="fab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Statistiche</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg>Conti</div>
  </nav>
  <div class="home-ind"></div>
</div>

<nav class="variant-picker" aria-label="Varianti">
  <button type="button" data-variant="spinner">1 Spinner</button>
  <button type="button" data-variant="frames">2 Cornici</button>
  <button type="button" data-variant="blocks">3 Blocchi</button>
  <button type="button" data-variant="chrome">4 Etichette</button>
  <span class="sep"></span>
  <button type="button" id="replay" title="R">↻ Replay</button>
  <button type="button" id="hold" aria-pressed="true" title="Spazio">Blocca</button>
  <button type="button" id="theme" title="T">Tema</button>
</nav>

<script>
const VARIANTS = ['spinner', 'frames', 'blocks', 'chrome'];
const CAPTIONS = {
  spinner: '<b>Spinner</b> — niente della Home finale: una rotella con “Caricamento…” dove arriveranno le card.',
  frames: '<b>Cornici</b> — solo i contorni delle card, alle altezze reali, vuoti e pulsanti.',
  blocks: '<b>Blocchi</b> — card con un blocco per ogni riga, etichette comprese (come StatsSkeleton).',
  chrome: '<b>Etichette</b> — card con etichette e intestazioni vere; solo cifre e righe sono blocchi.',
};
const REPLAY_MS = 1400;

const sk = (w, h = 12, r) =>
  `<span class="sk" style="width:${typeof w === 'number' ? w + 'px' : w};height:${h}px${r ? `;border-radius:${r}` : ''}"></span>`;

const skRow = () => `
  <div class="li">${sk(32, 32, 'var(--r-icon)')}
    <div class="txt" style="display:flex;flex-direction:column;gap:6px">${sk('55%')}${sk('30%', 10)}</div>${sk(60)}
  </div>`;
const skRows = (n) => `<div class="list">${Array.from({ length: n }, skRow).join('')}</div>`;
const skBudget = () => `<div class="budget">${[0, 1, 2].map(() => `
  <div><div class="b-top">${sk('40%')}${sk(70)}</div>${sk('100%', 4, '2px')}</div>`).join('')}</div>`;
const heroFigures = () => `
  <div style="height:52px;display:flex;align-items:center;margin-top:2px">${sk(180, 36, 'var(--r-input)')}</div>
  <div style="margin-top:14px">${sk('100%', 8)}</div>`;
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
const wrap = (inner) => `<div role="progressbar" aria-label="Caricamento…" style="display:flex;flex-direction:column;gap:var(--gap)">${inner}</div>`;

const LOADING = {
  spinner: () => wrap(`
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:96px 0">
      <div class="spinner"></div><div class="foot muted">Caricamento…</div>
    </div>`),

  frames: () => wrap([158, 190, 300].map((h) => `<div class="card pulse" style="height:${h}px"></div>`).join('')),

  blocks: () => wrap(`
    <div class="card">${sk(90)}${heroFigures()}
      <div class="row between" style="margin-top:12px">${sk(110, 10)}${sk(110, 10)}</div></div>
    <div class="card"><div class="row between">${sk(70)}${sk(90, 10)}</div>${skBudget()}</div>
    <div class="card flush"><div class="row between" style="padding:16px 16px 4px">${sk(80)}${sk(100, 10)}</div>${skRows(5)}</div>`),

  chrome: () => wrap(`
    <div class="card"><div class="foot muted">Rimasto da spendere</div>${heroFigures()}
      <div class="row between foot muted" style="margin-top:10px">
        <span class="row" style="gap:6px">Entrate ${sk(60, 10)}</span>
        <span class="row" style="gap:6px">Uscite ${sk(60, 10)}</span></div></div>
    <div class="card"><div class="card-head"><span class="t">Budget</span></div>${skBudget()}</div>
    <div class="card flush"><div style="padding:16px 16px 4px"><div class="card-head"><span class="t">Ultime transazioni</span><span class="s">Tutte le transazioni</span></div></div>${skRows(5)}</div>`),
};

const ICONS = {
  cart: '<path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/>',
  cup: '<path d="M5 8h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12h2"/>',
  play: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>',
  fuel: '<path d="M5 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14M4 20h12M15 9h2a2 2 0 0 1 2 2v5a1 1 0 0 0 2 0V8l-3-3"/><path d="M8 8h4"/>',
};
const TX = [
  ['Esselunga', 'Spesa · Carta', '−€', '62', '40', 'cart', '#63926F'],
  ['Bar Centrale', 'Ristoranti · Contanti', '−€', '3', '80', 'cup', '#C57B4E'],
  ['Stipendio', 'Entrate · Conto', '+€', '2.440', '00', 'wallet', '#5A82A6', true],
  ['Netflix', 'Abbonamenti · Carta', '−€', '12', '99', 'play', '#A06FA0'],
  ['Benzina Q8', 'Trasporti · Carta', '−€', '45', '00', 'fuel', '#B4894A'],
];
const loaded = () => `<div class="enter" style="display:flex;flex-direction:column;gap:var(--gap)">
  <div class="card"><div class="foot muted">Rimasto da spendere</div>
    <div class="hero">€869<span class="dec">,53</span></div>
    <div class="bar"><i style="width:64%"></i><span class="pace" style="left:87%"></span></div>
    <div class="row between foot muted" style="margin-top:10px;font-variant-numeric:tabular-nums"><span>Entrate €2.440,00</span><span>Uscite €1.570,47</span></div></div>
  <div class="card"><div class="card-head"><span class="t">Budget</span><span class="s">nei limiti</span>${chev}</div>
    <div class="budget">${[['Spesa', '€312 di €400', 78], ['Ristoranti', '€96 di €150', 64], ['Trasporti', '€88 di €200', 44]].map(([n, v, p]) => `
      <div><div class="b-top"><span>${n}</span><span class="muted" style="font-variant-numeric:tabular-nums">${v}</span></div><div class="b-bar"><i style="width:${p}%"></i></div></div>`).join('')}</div></div>
  <div class="card flush"><div style="padding:16px 16px 4px"><div class="card-head"><span class="t">Ultime transazioni</span><span class="s">Tutte le transazioni</span>${chev}</div></div>
    <div class="list">${TX.map(([t, s, sign, i, d, ic, c, pos]) => `
      <div class="li"><span class="ib" style="background:${c}26;color:${c}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]}</svg></span>
        <div class="txt"><div class="ttl">${t}</div><div class="sub">${s}</div></div>
        <span class="amt ${pos ? 'pos' : ''}">${sign}${i}<span class="dec">,${d}</span></span></div>`).join('')}</div></div>
</div>`;

const content = document.getElementById('content');
const phone = document.getElementById('phone');
const holdBtn = document.getElementById('hold');
let held = true;
let timer = null;

function current() {
  const v = new URLSearchParams(location.search).get('variant');
  return VARIANTS.includes(v) ? v : 'spinner';
}
function render() {
  const v = current();
  document.querySelectorAll('[data-variant]').forEach((b) => b.setAttribute('aria-current', String(b.dataset.variant === v)));
  document.getElementById('caption').innerHTML = CAPTIONS[v];
  content.innerHTML = LOADING[v]();
}
function select(v) {
  const url = new URL(location.href);
  url.searchParams.set('variant', v);
  history.replaceState(null, '', url);
  clearTimeout(timer);
  render();
}
function replay() {
  clearTimeout(timer);
  held = false; holdBtn.setAttribute('aria-pressed', 'false');
  render();
  timer = setTimeout(() => {
    const el = content.firstElementChild;
    el?.classList.add('leaving');
    setTimeout(() => { content.innerHTML = loaded(); }, 120);
  }, REPLAY_MS);
}
function toggleHold() {
  held = !held; holdBtn.setAttribute('aria-pressed', String(held));
  clearTimeout(timer);
  held ? render() : (content.innerHTML = loaded());
}
function toggleTheme() {
  phone.dataset.theme = phone.dataset.theme === 'dark' ? 'light' : 'dark';
}

document.querySelectorAll('[data-variant]').forEach((b) => b.addEventListener('click', () => select(b.dataset.variant)));
document.getElementById('replay').addEventListener('click', replay);
holdBtn.addEventListener('click', toggleHold);
document.getElementById('theme').addEventListener('click', toggleTheme);
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = VARIANTS.indexOf(current());
  if (e.key === 'ArrowRight') select(VARIANTS[(i + 1) % VARIANTS.length]);
  else if (e.key === 'ArrowLeft') select(VARIANTS[(i + VARIANTS.length - 1) % VARIANTS.length]);
  else if (/^[1-4]$/.test(e.key)) select(VARIANTS[Number(e.key) - 1]);
  else if (e.key === 'r') replay();
  else if (e.key === 't') toggleTheme();
  else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); toggleHold(); }
});
render();
</script>
</body>
</html>
