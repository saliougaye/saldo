<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="self-hosting-upload-t self-hosting-upload-d">
  <title id="self-hosting-upload-t">An attachment upload with S3</title>
  <desc id="self-hosting-upload-d">The app asks the server for an upload with the size and type. The server answers with a URL signed for that one object, valid five minutes. The app sends the bytes straight to the bucket, then calls complete, and the server checks that the object is in the bucket at the expected size.</desc>
  <style>
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #171717; }
    .m { font-size: 13px; fill: #6E6E6E; }
    .b { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .bx { fill: #FFFFFF; stroke: rgba(0, 0, 0, 0.18); stroke-width: 1.5; }
    .bx-r { fill: #F1F1EF; }
    .bx-ink { fill: #171717; }
    .ti { fill: #FFFFFF; }
    .ln { fill: none; stroke: #6E6E6E; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .lane { fill: none; stroke: rgba(0, 0, 0, 0.18); stroke-width: 1.5; stroke-dasharray: 3 5; }
    .ah { fill: #6E6E6E; }
    @media (prefers-color-scheme: dark) {
      text { fill: #EDEDED; }
      .m { fill: #8C8C8C; }
      .bx { fill: #0A0A0A; stroke: rgba(255, 255, 255, 0.2); }
      .bx-r { fill: #1A1A1A; }
      .bx-ink { fill: #EDEDED; }
      .ti { fill: #0A0A0A; }
      .ln { stroke: #8C8C8C; }
      .lane { stroke: rgba(255, 255, 255, 0.2); }
      .ah { fill: #8C8C8C; }
    }
  </style>
  <defs>
    <marker id="self-hosting-upload-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bx" x="15" y="16" width="190" height="56" rx="14"/>
  <text class="b" x="110" y="40" text-anchor="middle">Saldo app</text>
  <text class="m" x="110" y="60" text-anchor="middle">Has the photo</text>
  <path class="lane" d="M110 72 L110 344"/>
  <rect class="bx" x="285" y="16" width="190" height="56" rx="14"/>
  <text class="b" x="380" y="40" text-anchor="middle">Saldo server</text>
  <text class="m" x="380" y="60" text-anchor="middle">Never sees the bytes</text>
  <path class="lane" d="M380 72 L380 344"/>
  <rect class="bx" x="555" y="16" width="190" height="56" rx="14"/>
  <text class="b" x="650" y="40" text-anchor="middle">S3 bucket</text>
  <text class="m" x="650" y="60" text-anchor="middle">R2, MinIO, B2, …</text>
  <path class="lane" d="M650 72 L650 344"/>
  <path class="ln" d="M110 112 L374 112" marker-end="url(#self-hosting-upload-a)"/>
  <text class="m" x="245.0" y="102" text-anchor="middle">upload-intent: size and type</text>
  <path class="ln dash" d="M380 164 L116 164" marker-end="url(#self-hosting-upload-a)"/>
  <text class="m" x="245.0" y="154" text-anchor="middle">A signed URL for this object (5 min)</text>
  <path class="ln" d="M110 216 L644 216" marker-end="url(#self-hosting-upload-a)"/>
  <text class="m" x="380.0" y="206" text-anchor="middle">PUT the bytes, up to 10 MB</text>
  <path class="ln" d="M110 268 L374 268" marker-end="url(#self-hosting-upload-a)"/>
  <text class="m" x="245.0" y="258" text-anchor="middle">complete</text>
  <path class="ln dash" d="M386 320 L644 320" marker-end="url(#self-hosting-upload-a)"/>
  <text class="m" x="515.0" y="310" text-anchor="middle">Checks that the object is there, at its size</text>
</svg>
