# Self-hosting: the server, built into an image, and its database. This is the file you deploy.
#
# Run from the repository root:
#   docker compose -f apps/web/docker/docker-compose.yml up -d --build
#
# For *developing* Saldo, use docker-compose.dev.yml instead: it brings up what the server talks to
# and leaves the server itself to `pnpm --filter web dev`, so a change reloads without a rebuild.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saldo}
      POSTGRES_DB: saldo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saldo']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../../..
      dockerfile: apps/web/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://saldo:${POSTGRES_PASSWORD:-saldo}@postgres:5432/saldo
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?set WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Saldo}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # 32 random bytes, base64: `openssl rand -base64 32`. Keep it; it encrypts the stored SMTP password.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY}
      # Without this the server would keep no attachments at all: `none` is the default (§10).
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-fs}
      STORAGE_DIR: /data/attachments
      # Empty means «not set here»: the admin panel chooses (first-user until it does). Set, it locks the panel.
      REGISTRATION: ${REGISTRATION:-}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
      # Outgoing email. A host here makes the whole group the configuration and locks the panel's form.
      # A provider's SMTP relay works as is — e.g. Resend: SMTP_HOST=smtp.resend.com, SMTP_PORT=465 (or 587;
      # 2465/2587 if blocked), SMTP_USER=resend, SMTP_PASSWORD=<API key>, SMTP_FROM on a verified domain.
      # Postmark, Amazon SES, Mailgun, Brevo: docs/self-hosting.md, «Provider via SMTP».
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_REDIRECT_SCHEMES: ${APP_REDIRECT_SCHEMES:-saldo}
      # The reverse proxy in front of this container (Caddy), so the auth rate limit can find the real
      # caller in X-Forwarded-For. Empty means no proxy. See apps/web/.env.example and Caddyfile.example.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # The schema's own default applies only when the variable is missing, and an empty string is not a
      # time zone, so the default is repeated here.
      DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-UTC}
      # Empty means «not set here»: /admin/mcp chooses (on until it does). Set, it locks the switch.
      MCP_ENABLED: ${MCP_ENABLED:-}
    volumes:
      - attachments:/data/attachments
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres-data:
  attachments:
