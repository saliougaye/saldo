# §16's second end-to-end flow: editing one occurrence of a recurring transaction with "Questa e le
# successive" replaces the future occurrences and leaves the past ones alone (§5.9 / §6.21).
#
# WHERE IT STARTS
# ---------------
# Run it with --seed: `apps/mobile/maestro/run.sh <udid> apps/mobile/maestro/edit-recurring-following.yaml --seed`.
# The seeded app starts on the tabs, behind the first-run intro. The flow taps the intro away.
# It uses the seeded account «Conto corrente» (demo data, not UI copy). Any account would do: this
# flow creates the series it edits. The simulator runs in English.
#
# WHY IT CREATES ITS OWN DATA INSTEAD OF USING THE SEEDER
# ------------------------------------------------------
# `pnpm --filter mobile seed:db <path-to-saldo.db> [--reset]` (the script is
# `apps/mobile/scripts/seed-database.ts`) writes onboarding settings plus the demo fixture straight
# into an existing database file — the app has to have launched once so its migrations ran, and the
# file is found with `xcrun simctl get_app_container booted io.github.saldo.app data`.
#
# But its recurring rows are only half recurring. `seedDemoData` stamps a synthetic
# `recurrenceId: 'demo-recurrence:<description>'` on them and creates no row in `recurrences`
# (`apps/mobile/src/db/demo.ts`), and `RecurrenceScopeSheet` renders nothing at all when the
# recurrence behind an occurrence cannot be found. Saving a seeded "recurring" transaction
# therefore opens no sheet. There is no seed command that produces a real series; the only thing
# that creates one is "Ripeti" in the form, which is what this flow uses — and which gets
# `startRecurrence` and the materialiser covered into the bargain.
#
# `appId` is the `SALDO_BUNDLE_ID` fallback in `apps/mobile/app.config.ts`; a fork built with that
# variable set has a different one.
appId: io.github.saldo.app
name: Edit a recurring transaction, this one and the following ones
---
- launchApp
# The first-run intro (§6.40) covers the tabs once on a seeded install. Wait for it, then tap it away.
# `tab-fab` is no good as the first wait: the tab bar is under the intro and the FAB still matches.
- extendedWaitUntil:
    visible:
      id: "intro-continue"
    timeout: 30000
- tapOn:
    id: "intro-continue"
- extendedWaitUntil:
    visible:
      id: "tab-fab"
    timeout: 20000

# 1. A monthly series, dated today. Saving with "Repeat" on turns the row into the first occurrence
#    of a new recurrence and materialises the rest up to the end of the period after this one.
- tapOn:
    id: "tab-fab"
- tapOn:
    id: "txform-amount"
- tapOn:
    id: "keypad-key-2"
- tapOn:
    id: "keypad-key-0"
- tapOn:
    id: "keypad-key-0"
# «Done» puts the keypad away, which is what frees the category grid below it.
- tapOn:
    id: "keypad-action"
- tapOn:
    id: "txform-category-0"
# The form does not pick an account for you.
- tapOn: "Conto corrente"
# "Repeat" is a chip row under the date (§6.16): "Every month" is the second chip. It is on screen
# now, above the fold, so tap it before the form is swiped up.
- tapOn:
    id: "txform-repeat-monthly"
# The description card starts under the pinned footer, and Maestro still finds it there. A plain tap
# or `scrollUntilVisible` would land on the footer's «Add» button. Swipe the form up by hand.
- swipe:
    start: 50%, 70%
    end: 50%, 35%
- tapOn:
    id: "txform-description"
- inputText: "Maestro rent"
# Return closes the keyboard, which covers the footer. `hideKeyboard` fails on iOS.
- pressKey: Enter
- tapOn:
    id: "txform-submit"

# Home, "Recent transactions": today's occurrence. Text, but text this flow typed. A row is one
# accessible element labelled "<title>, <category>, <amount>", so the selector is a regex that starts
# with the title.
- extendedWaitUntil:
    visible: "Maestro rent.*"
    timeout: 10000

# 2. The next occurrence is a month out, in the next period. Navigation stops at the current one
#    (§6.15), so it is found in the upcoming fold, which reaches the end of the next period and
#    folds everything dated after today behind one row (§5.12) — hence the disclosure tap.
- tapOn:
    id: "tab-transactions"
- tapOn:
    id: "transactions-upcoming"
- scrollUntilVisible:
    element: "Maestro rent.*"
    direction: DOWN

# 3. Open that future occurrence and rename it. The description is what changes, not the amount:
#    it is the one field whose new value can be asserted without knowing the device's locale.
- tapOn: "Maestro rent.*"
- tapOn:
    id: "transaction-edit"
# The edit form has two pinned buttons, «Save» and «Delete». They cover the description card, so swipe
# the form up first. A tap on the covered field would press «Delete» and open its confirmation.
- swipe:
    start: 50%, 70%
    end: 50%, 35%
- tapOn:
    id: "txform-description"
- eraseText
- inputText: "Maestro moved"
# Return closes the keyboard, which covers the footer's submit button.
- pressKey: Enter
- tapOn:
    id: "txform-submit"

# 4. Saving an occurrence asks which occurrences the edit is for. If this assertion fails, the
#    sheet did not open — which is what a missing `recurrences` row looks like.
- assertVisible:
    id: "recurrence-scope-this-and-following"
- tapOn:
    id: "recurrence-scope-this-and-following"

# 5. The sheet closes the screen behind it, which leaves the detail of an occurrence that has just
#    been tombstoned. Back out of it to the list, where the upcoming fold is still open.
- tapOn:
    id: "back-button"
# The future occurrence carries the new description.
- assertVisible: "Maestro moved.*"

# 6. The occurrence that already happened is untouched: still in the same list, still called what
#    it was. (No duplicate check here any more: today's row and the next one now share this list,
#    so "not visible" cannot tell a duplicate apart; `planRecurrenceEdit`'s tests cover that.)
- scrollUntilVisible:
    element: "Maestro rent.*"
    direction: DOWN
