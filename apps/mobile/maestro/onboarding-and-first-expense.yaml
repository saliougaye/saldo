# §16's first end-to-end flow: onboarding -> add an expense -> Home shows it.
#
# WHERE IT STARTS
# ---------------
# From a fresh install (`npx expo run:ios`, see README "Step 3"): the welcome's «Solo su questo
# telefono» door leads straight to the start chooser with no server and no account (§6.29 step 0),
# so nothing has to be done by hand first. To run it again, delete the app or its database:
#
#   xcrun simctl get_app_container booted io.github.saldo.app data
#   rm -f "<that path>/Documents/SQLite/saldo.db"
#
# It also still runs on a device signed in to a **brand new** account (the server door and the
# passkey ceremony done by hand, since Maestro drives neither a browser nor the platform
# authenticator): that device opens on the chooser once its first sync comes back empty, and the
# welcome tap below is skipped.
#
# `appId` is the `SALDO_BUNDLE_ID` fallback in `apps/mobile/app.config.ts`. A fork that builds with
# that variable set has a different one — change it here to match.
appId: io.github.saldo.app
name: Onboarding, then a first expense on Home
---
- launchApp

# §6.29 step 0 on a fresh install: the phone door. Absent on a signed-in device, which boots onto
# the chooser instead.
- runFlow:
    when:
      visible:
        id: "welcome-phone"
    commands:
      - tapOn:
          id: "welcome-phone"

# Before step 1 — where the data comes from. This flow starts from scratch. The wait is long
# because a freshly signed-in device shows the "first sync" spinner until a cycle comes back.
- extendedWaitUntil:
    visible:
      id: "onboarding-start-fresh"
    timeout: 30000
- tapOn:
    id: "onboarding-start-fresh"

# Step 1 of 5 — how you track spending. The month is already selected (`INITIAL.periodKind` in
# `src/features/onboarding/state.tsx`), so there is nothing to choose.
- tapOn:
    id: "onboarding-period-continue"

# Step 2 of 5 — the first account. The field is autofocused, and the button is in the pinned
# footer, which `Screen` keeps above the keyboard on both platforms.
- tapOn:
    id: "onboarding-account-name"
- inputText: "Maestro account"
- tapOn:
    id: "onboarding-account-continue"

# Step 3 of 5 — opening balance, typed on Saldo's own keypad (D23). The pad is pinned open on this
# step, so its tall key is «Continua» and the footer's button steps aside while it is up.
- tapOn:
    id: "onboarding-balance-amount"
- tapOn:
    id: "keypad-key-1"
- tapOn:
    id: "keypad-key-0"
- tapOn:
    id: "keypad-key-0"
- tapOn:
    id: "keypad-key-0"
- tapOn:
    id: "keypad-action"

# Step 4 of 5 — the category grid, every tile selected by default.
- tapOn:
    id: "onboarding-categories-continue"

# Step 5 of 5 — the permissions, one row open at a time. «Più tardi» on each: the flow must not
# depend on a system prompt it cannot answer. On a fresh install all three rows are pending; a
# permission the OS already decided starts closed and has no «Più tardi». "Inizia" writes settings,
# the account and the categories, then replaces the route with the tabs.
- tapOn:
    id: "permission-notifications-later"
- tapOn:
    id: "permission-camera-later"
- tapOn:
    id: "permission-appLock-later"
- tapOn:
    id: "onboarding-start"

# The tabs. The FAB is part of the tab bar, so it is here on every tab (§6.14).
- extendedWaitUntil:
    visible:
      id: "tab-fab"
    timeout: 20000
- tapOn:
    id: "tab-fab"

# The form opens as a sheet with the amount field autofocused (§6.16), so Saldo's keypad is already
# up and the digits below are its keys.
#
# «Fatto» is not decoration: the category grid is content, not footer, and on a small screen its
# first row sits about where the keypad starts. If this flow ever fails on the tile below, this is
# the line to suspect.
- tapOn:
    id: "txform-amount"
- tapOn:
    id: "keypad-key-1"
- tapOn:
    id: "keypad-key-2"
- tapOn:
    id: "keypad-key-separator"
- tapOn:
    id: "keypad-key-5"
# «Fatto» puts the keypad away, which is what frees the category grid below it.
- tapOn:
    id: "keypad-action"
# Whichever category the grid ranks first; an expense cannot be saved without one.
- tapOn:
    id: "txform-category-0"
- tapOn:
    id: "txform-description"
- inputText: "Maestro coffee"
- hideKeyboard
- tapOn:
    id: "txform-submit"

# Back on Home, in "Ultime transazioni". The description is what the row is titled with when it has
# one, and it is text this flow typed rather than a translated label — which is the only reason a
# text selector is safe here.
- assertVisible: "Maestro coffee"
